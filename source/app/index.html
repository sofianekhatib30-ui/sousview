<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="LiftView: la tua scheda di palestra sugli occhiali. Serie, ripetizioni, carichi e recuperi a colpo d'occhio, con le mani sul bilanciere. Nessuna fotocamera, i dati restano sul dispositivo.">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>LiftView</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Atkinson+Hyperlegible+Next:wght@400;600;800&display=swap">
<style>
  * { box-sizing: border-box; }
  :root {
    /* Display additivo: il nero è trasparente. I colori dei dischi sono quelli da gara. */
    --ink: #F4F6F8;       /* magnesite: testo e focus */
    --quiet: #9AA3AD;
    --blue: #4DA3FF;      /* disco da 20: marchio, recupero */
    --red: #FF4D5A;       /* disco da 25: avvisi, stop */
    --gold: #FFC93C;      /* disco da 15: record */
    --green: #4FD18B;     /* disco da 10: fatto */
    --line: rgba(244, 246, 248, 0.24);
    --surface: rgba(244, 246, 248, 0.055);
    --dim: rgba(244, 246, 248, 0.2);
    --wide: 'Archivo', 'Arial Black', system-ui, sans-serif;
    --sans: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: clamp(15px, 4.1vmin, 30px);
    color-scheme: dark;
  }
  html, body, #app { inline-size: 100%; block-size: 100%; }
  body { margin: 0; overflow: hidden; background: #000; color: var(--ink); font-family: var(--sans); line-height: 1.3; -webkit-font-smoothing: antialiased; }
  .shell { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-areas: 'h' 'r' 'c' 'f'; inline-size: 100%; block-size: 100%; padding: 4vmin 5vmin; overflow: hidden; }
  header { grid-area: h; display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; min-block-size: 1.35rem; margin-block-end: 2vmin; min-inline-size: 0; }
  .brand { display: flex; align-items: center; gap: 0.35rem; flex: none; font-family: var(--wide); font-variation-settings: 'wdth' 118; font-weight: 900; font-size: 0.86rem; color: var(--blue); white-space: nowrap; }
  .brand svg { inline-size: 1.6rem; block-size: 0.8rem; }
  .timing .brand-word { display: none; }
  .timers { display: flex; gap: 0.35rem; flex-wrap: wrap; justify-content: flex-end; min-inline-size: 0; }
  .timer { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.1rem 0.55rem; border-radius: 2rem; border: 2px solid var(--blue); color: var(--blue); font-size: 0.7rem; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .timer.done { background: var(--gold); border-color: var(--gold); color: #000; animation: blink 0.8s steps(2) infinite; }
  .clockchip { font-size: 0.7rem; font-weight: 800; color: var(--quiet); font-variant-numeric: tabular-nums; }
  @keyframes blink { 50% { opacity: 0.35; } }
  #ring { grid-area: r; display: grid; gap: 0.35rem; margin-block-end: 2vmin; }
  #ring:empty { display: none; }
  #ring button { margin: 0; background: var(--gold); border-color: var(--gold); color: #000; }
  #ring button * { color: #000; stroke: #000; }
  .content { grid-area: c; min-block-size: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding: 7px 8px; margin: -7px -8px; }
  .content::-webkit-scrollbar { display: none; }
  footer { grid-area: f; display: flex; gap: 0.55rem; margin-block-start: 2vmin; }
  footer:empty { display: none; }
  footer button { inline-size: auto; flex: 1 1 auto; justify-content: center; text-align: center; margin: 0; }
  footer button.sq { flex: 0 0 3.2rem; padding-inline: 0; }

  h1 { font-family: var(--wide); font-variation-settings: 'wdth' 112; font-weight: 850; font-size: 1.45rem; line-height: 1.02; margin: 0.05rem 0 0.4rem; overflow-wrap: break-word; hyphens: auto; }
  h1.hero { font-size: 1.75rem; margin-block-end: 0.5rem; }
  h2 { display: flex; align-items: center; gap: 0.45rem; font-size: 0.78rem; font-weight: 800; color: var(--quiet); margin: 1rem 0 0.45rem; }
  p { margin: 0 0 0.5rem; }
  .intro { font-size: 0.84rem; margin-block-end: 0.6rem; }
  .meta { color: var(--quiet); font-size: 0.74rem; }
  .hint { font-size: 0.72rem; color: var(--quiet); margin: 0.5rem 0; }
  .ic { inline-size: 1.2rem; block-size: 1.2rem; flex: none; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }

  button, input { font: inherit; color: inherit; }
  button { display: flex; align-items: center; gap: 0.6rem; inline-size: 100%; min-block-size: 2.3rem; text-align: start; padding: 0.5rem 0.8rem; border-radius: 0.55rem; border: 2px solid var(--line); background: var(--surface); font-size: 0.88rem; font-weight: 700; cursor: pointer; margin: 0 0 0.45rem; -webkit-tap-highlight-color: transparent; }
  button .grow { flex: 1; min-inline-size: 0; overflow-wrap: break-word; }
  button .sub { display: block; font-weight: 400; font-size: 0.68rem; color: var(--quiet); margin-block-start: 0.05rem; }
  button > .ic { color: var(--blue); }
  button.primary { border: 3px solid var(--blue); color: var(--blue); justify-content: center; }
  button.primary .ic { inline-size: 1rem; block-size: 1rem; }
  button.go { border-color: var(--green); color: var(--green); }
  button.stop { border-color: var(--red); color: var(--red); }
  /* Focus: una lastra color magnesite, testo ritagliato in nero. */
  button:focus { outline: 3px solid var(--blue); outline-offset: 3px; background: var(--ink); border-color: var(--ink); color: #000; }
  button:focus * { color: #000 !important; }
  button:focus .ic { stroke: #000; }
  input:focus { outline: 3px solid var(--blue); outline-offset: 2px; }

  .row-pict { inline-size: 2.2rem; block-size: 2.2rem; flex: none; display: grid; place-items: center; border-radius: 0.45rem; border: 2px solid var(--dim); }
  .row-pict svg { inline-size: 1.9rem; block-size: 1.9rem; }
  button:focus .row-pict { border-color: #000; }
  .rm { display: flex; flex-wrap: wrap; align-items: center; gap: 0.12rem 0.55rem; font-size: 0.66rem; color: var(--quiet); font-weight: 600; margin-block-start: 0.12rem; }
  .rm b { color: var(--ink); font-variant-numeric: tabular-nums; }
  button:focus .rm b { color: #000; }
  .pips { display: inline-flex; gap: 0.16rem; }
  .pips i { inline-size: 0.42rem; block-size: 0.42rem; border-radius: 50%; border: 2px solid var(--blue); }
  .pips i.on { background: var(--blue); }
  button:focus .pips i { border-color: #000; }
  button:focus .pips i.on { background: #000; }

  /* Figure degli esercizi */
  .fig { stroke: var(--ink); fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .fig .eq { stroke: var(--blue); }
  .fig .gr { stroke: var(--dim); }
  .fig .hd { fill: var(--ink); stroke: none; }
  button:focus .fig, button:focus .fig .eq { stroke: #000; }
  button:focus .fig .hd { fill: #000; }

  /* Schermata della serie */
  .set-h { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; font-size: 0.72rem; font-weight: 800; color: var(--quiet); }
  .set-h .warm { color: var(--gold); }
  .dots { display: flex; gap: 0.25rem; margin: 0.3rem 0 0.5rem; }
  .dots i { flex: 1; block-size: 0.32rem; border-radius: 1rem; background: var(--dim); }
  .dots i.on { background: var(--green); }
  .dots i.cur { background: var(--ink); }
  .exname { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.65rem; align-items: center; }
  .exname svg { inline-size: 3.2rem; block-size: 3.2rem; }
  .exname h1 { margin: 0; font-size: 1.3rem; }
  .cue { font-size: 0.8rem; color: var(--quiet); margin: 0.35rem 0 0; }
  .nums { display: grid; grid-template-columns: 1fr auto; gap: 0.6rem; align-items: end; margin-block-start: 0.55rem; }
  .big { font-family: var(--wide); font-variation-settings: 'wdth' 125; font-weight: 900; font-size: 2.7rem; line-height: 0.95; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; white-space: nowrap; }
  .big small { font-size: 0.42em; font-weight: 800; color: var(--quiet); margin-inline-start: 0.12em; }
  .big.reps { color: var(--blue); text-align: end; }
  .lbl { font-size: 0.66rem; color: var(--quiet); font-weight: 700; }
  .lbl.r { text-align: end; }
  .steppers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.4rem; margin-block-start: 0.55rem; }
  .steppers button { margin: 0; justify-content: center; font-size: 0.8rem; padding: 0.3rem; min-block-size: 2.1rem; font-variant-numeric: tabular-nums; }
  .steppers.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  /* La firma: il bilanciere con i dischi nei colori da gara. */
  .barbell { display: flex; align-items: center; gap: 0.5rem; margin-block-start: 0.5rem; min-block-size: 2.4rem; }
  button.mini { min-block-size: 1.8rem; padding-block: 0.2rem; font-size: 0.72rem; margin-block-start: 0.45rem; color: var(--quiet); }
  .barbell svg { flex: none; block-size: 2.4rem; inline-size: auto; max-inline-size: 60%; }
  .barbell .pl { font-size: 0.74rem; font-weight: 700; color: var(--quiet); }
  .barbell .pl b { color: var(--ink); }

  .rest-wrap { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.9rem; align-items: center; margin-block-start: 0.3rem; }
  .ringsvg { inline-size: 9.5rem; block-size: 9.5rem; }
  .ringsvg circle { fill: none; stroke-width: 9; }
  .ringsvg .bg { stroke: var(--dim); }
  .ringsvg .fg { stroke: var(--blue); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
  .ringsvg text { fill: var(--ink); font-family: var(--wide); font-weight: 900; font-variation-settings: 'wdth' 120; font-size: 26px; text-anchor: middle; dominant-baseline: central; font-variant-numeric: tabular-nums; }
  .ringsvg.end .fg { stroke: var(--gold); }
  .next-card { font-size: 0.8rem; }
  .next-card b { display: block; font-size: 1rem; font-family: var(--wide); font-variation-settings: 'wdth' 110; font-weight: 800; line-height: 1.1; margin: 0.15rem 0 0.25rem; }
  .next-card .w { color: var(--blue); font-weight: 800; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
  .phase { font-family: var(--wide); font-variation-settings: 'wdth' 125; font-weight: 900; font-size: 1.5rem; line-height: 1; }
  .phase.work { color: var(--green); }
  .phase.rest { color: var(--blue); }

  .done-hero { text-align: center; padding-block-start: 0.4rem; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.4rem; margin: 0.5rem 0; }
  .stat { border: 2px solid var(--dim); border-radius: 0.6rem; padding: 0.4rem 0.5rem; }
  .stat b { display: block; font-family: var(--wide); font-variation-settings: 'wdth' 118; font-weight: 900; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 0.62rem; color: var(--quiet); font-weight: 700; }
  .pr { display: flex; gap: 0.5rem; align-items: center; color: var(--gold); font-weight: 800; font-size: 0.82rem; padding: 0.25rem 0; }
  .pr .ic { color: var(--gold); }
  .note { border-inline-start: 3px solid var(--blue); padding: 0.25rem 0 0.25rem 0.7rem; font-size: 0.78rem; margin: 0.5rem 0 0.6rem; }
  .note.rd { border-color: var(--red); }
  .note b { display: block; font-size: 0.68rem; color: var(--blue); margin-block-end: 0.1rem; }
  .note.rd b { color: var(--red); }
  .list-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.6rem; font-size: 0.82rem; padding: 0.35rem 0; border-block-end: 1px solid rgba(244, 246, 248, 0.1); }
  .list-row b { font-variant-numeric: tabular-nums; color: var(--blue); white-space: nowrap; }
  .list-row.gold b { color: var(--gold); }

  .opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.4rem; margin-block-end: 0.3rem; }
  .opts.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .opts button { margin: 0; justify-content: center; text-align: center; font-size: 0.76rem; padding: 0.35rem 0.4rem; min-block-size: 2.1rem; }
  .opts button[aria-pressed=true] { border-color: var(--blue); color: var(--blue); background: rgba(77, 163, 255, 0.1); }
  .opts button[aria-pressed=true]:focus { background: var(--ink); border-color: var(--ink); color: #000; }
  .langs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.45rem; margin-block-end: 0.6rem; }
  .langs button { margin: 0; padding: 0.5rem 0.6rem; font-size: 0.8rem; }
  .langs button.on { border-color: var(--blue); color: var(--blue); }
  .langs button.on:focus { color: #000; }

  .state { display: grid; justify-items: center; text-align: center; gap: 0.6rem; padding: 1.2rem 0.4rem; color: var(--quiet); font-size: 0.82rem; }
  .state button { inline-size: auto; padding-inline: 1.4rem; justify-content: center; }
  .toast { position: fixed; inset-inline: 6vmin; inset-block-start: 11vmin; background: #000; border: 2px solid var(--blue); padding: 0.5rem 0.8rem; border-radius: 0.6rem; font-size: 0.8rem; font-weight: 700; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .sr { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .tight .big { font-size: 2.2rem; }
  .tight .exname svg { inline-size: 2.5rem; block-size: 2.5rem; }
  .tight .nums { margin-block-start: 0.35rem; }
  .tight .steppers { margin-block-start: 0.4rem; }
  .tighter .cue { display: none; }
  .tight .ringsvg { inline-size: 8rem; block-size: 8rem; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

      <h2>${esc(L.units)}</h2><div class="opts two"><button type="button" id="u-kg" aria-pressed="${unit === 'kg'}">${esc(L.kg)}</button><button type="button" id="u-lb" aria-pressed="${unit === 'lb'}">${esc(L.lb)}</button></div>
      <h2>${esc(L.barSet)}</h2><div class="opts">${(unit === 'kg' ? [20, 15, 10] : [45, 35]).map((b) => `<button type="button" id="sb-${b}" aria-pressed="${barW() === b}">${esc(fmtW(b))}</button>`).join('')}</div>
      <h2>${esc(L.sound)}</h2>${btn('voice', esc(voiceOn ? L.voiceOn : L.voiceOff), esc(L.voiceSub), '', 'clock')}${btn('beep', esc(beepOn ? L.beepOn : L.beepOff), esc(L.beepSub), '', 'clock')}
      <h2>${icon('lock')}${esc(L.privacyH)}</h2><p class="meta">${esc(L.privacy)}</p><p class="meta">${esc(L.disclaimer)}</p>
      ${btn('erase', esc(e.sure ? L.eraseSure : L.erase), '', 'stop', 'alert')}`;
    LANGS.forEach(([k]) => on('lang-' + k, () => { lang = k; store.set('lv_lang', k); document.documentElement.lang = k; render('lang-' + k); }));
    ['kg', 'lb'].forEach((k) => on('u-' + k, () => { unit = k; store.set('lv_unit', k); render('u-' + k); }));
    (unit === 'kg' ? [20, 15, 10] : [45, 35]).forEach((b) => on('sb-' + b, () => { if (unit === 'kg') { barKg = b; store.set('lv_bar', b); } else { barLb = b; store.set('lv_barlb', b); } render('sb-' + b); }));
    on('voice', () => { voiceOn = !voiceOn; store.set('lv_voice', voiceOn); render('voice'); });
    on('beep', () => { beepOn = !beepOn; store.set('lv_beep', beepOn); if (beepOn) beep(true); render('beep'); });
    on('erase', () => {
      if (!e.sure) { e.sure = 1; render('erase'); return; }
      ['lv_ex', 'lv_logs', 'lv_next', 'lv_last', 'lv_sess', 'lv_pr'].forEach((k) => store.del(k));
      ex = {}; logs = []; nextDay = {}; lastProgram = null; sess = null;
      toast(L.erased); goHome();
    });
    footerBack();
    return 'lang-' + lang;
  }

  function fit() {
    $content.classList.remove('tight', 'tighter');
    for (const c of ['tight', 'tighter']) { if ($content.scrollHeight <= $content.clientHeight + 4) return; $content.classList.add(c); }
  }
  function refocus(id) { const el = document.getElementById(id); if (el) el.focus({ preventScroll: false }); }
  function render(focusId) {
    for (const k in handlers) delete handlers[k];
    $content.classList.remove('tight', 'tighter');
    const e = cur();
    let primary;
    switch (e.s) {
      case 'welcome': primary = renderWelcome(); break;
      case 'programs': primary = renderPrograms(); break;
      case 'program': primary = renderProgram(); break;
      case 'day': primary = renderDay(); break;
      case 'set': primary = setScreen(); break;
      case 'rest': primary = restScreen(); break;
      case 'interval': primary = intervalScreen(); break;
      case 'done': primary = renderDone(); break;
      case 'plates': primary = renderPlates(); break;
      case 'resttool': primary = renderRestTool(); break;
      case 'history': primary = renderHistory(); break;
      case 'settings': primary = renderSettings(); break;
      default: e.s = 'home'; primary = renderHome();
    }
    if (cur() !== e) return;
    const ring = document.getElementById('ring'); ring.dataset.sig = '';
    if (e !== lastEntry) { $content.scrollTop = 0; lastEntry = e; }
    renderTimerbar();
    registerTools();
    saveStack();
    lastPrimary = primary;
    const want = focusId && document.getElementById(focusId) ? focusId : primary;
    requestAnimationFrame(() => { if (want) refocus(want); });
  }

  // ---------- Strumenti per Meta AI (WebMCP) ----------
  let toolsController = null, toolsKey = '';
  const withTimeout = (pr, ms) => Promise.race([pr, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
  function findProgram(q) {
    const n = norm(q);
    if (!n) return null;
    return D.programs.find((p) => p.id === q) || D.programs.find((p) => Object.values(p.name).some((v) => norm(v) === n)) || D.programs.find((p) => Object.values(p.name).some((v) => norm(v).includes(n) || n.includes(norm(v))));
  }
  function status() {
    if (!sess) return { active: false };
    if (sess.type === 'interval') { const st = intervalSteps(prog(sess.pid))[sess.pos]; const tm = workTimer(); return { active: true, program: pName(prog(sess.pid)), phase: st && st.ph, exercise: st && st.ex ? exI(st.ex).n : null, seconds_left: tm ? Math.ceil(tm.remaining) : null }; }
    const s = curSet(); const tm = workTimer();
    return { active: true, program: pName(prog(sess.pid)), screen: cur().s, exercise: s ? exI(s.ex).n : null, set: s ? `${s.n}/${s.of}` : null, warmup: s ? !!s.warm : null, weight: s && s.w != null ? fmtW(s.w) : null, target_reps: s ? s.goal : null, hold_seconds: s ? s.sec : null, rest_seconds_left: tm && tm.kind === 'rest' ? Math.ceil(tm.remaining) : null, sets_done: sess.sets.filter((x) => !x.warm).length, elapsed_min: Math.round((Date.now() - sess.start) / 60000) };
  }
  function registerTools() {
    if (!document.modelContext || typeof document.modelContext.registerTool !== 'function') return;
    const key = [cur().s, lang, unit, D.st, !!sess].join('|');
    if (key === toolsKey) return;
    toolsKey = key;
    if (toolsController) toolsController.abort();
    toolsController = new AbortController();
    const signal = toolsController.signal;
    const reg = (def) => { try { const pr = document.modelContext.registerTool(def, { signal }); if (pr && pr.catch) pr.catch(() => {}); } catch (er) { /* non deve bloccare l'app */ } };
    const core = () => withTimeout(loadCore(), 8000);
    reg({
      name: 'programs_list', description: 'Lists the LiftView workout programs (full body, 5×5, push pull legs, upper lower, bodyweight, Tabata, HIIT circuit, EMOM, mobility) with their days.', annotations: { readOnlyHint: true },
      async execute() { try { await core(); } catch (er) { return { error: 'offline' }; } return { language: NAME_EN[lang], programs: D.programs.map((p) => ({ id: p.id, name: pName(p), level: t().levels[p.level - 1], timed: p.type === 'interval', days: p.type === 'sets' ? p.days.map((d, i) => ({ index: i, name: d.n[lang], exercises: d.items.map((it) => exI(it.ex).n) })) : undefined })), next_action: 'Offer one or two in a short sentence, or call workout_start.' }; }
    });
    reg({
      name: 'workout_start', description: 'Starts a workout from a program and day. The display then shows one set at a time with automatic rest timers.',
      inputSchema: { type: 'object', properties: { program: { type: 'string', description: 'Program id or name from programs_list.' }, day: { type: 'number', description: 'Day index (0-based). Omit to use the next day in the rotation.' } }, required: ['program'] },
      async execute(input) {
        try { await core(); } catch (er) { return { error: 'offline' }; }
        if (!accepted) return { error: 'disclaimer_pending', next_action: 'Ask the user to read and accept the safety note on the display first. Stop.' };
        const p = findProgram(input && input.program);
        if (!p) return { error: 'not_found' };
        const d = p.type === 'sets' ? (Number.isInteger(input.day) && input.day >= 0 && input.day < p.days.length ? input.day : (nextDay[p.id] || 0) % p.days.length) : 0;
        startWorkout(p.id, d);
        return { ...status(), next_action: 'The first set is on screen. Say the exercise and weight in one short sentence. Stop.' };
      }
    });
    reg({ name: 'workout_status', description: 'Tells what the user is doing now: exercise, set, weight, target reps, rest time left.', annotations: { readOnlyHint: true }, async execute() { return { ...status(), next_action: 'Answer in one short sentence.' }; } });
    reg({
      name: 'plates_for', description: 'Says which plates to load on each side of the bar for a total weight, with the bar weight set in the app.', annotations: { readOnlyHint: true },
      inputSchema: { type: 'object', properties: { total: { type: 'number', description: `Total weight in ${unit}.` } }, required: ['total'] },
      async execute(input) { const w = Number(input && input.total); if (!(w > 0)) return { error: 'bad_weight' }; const r = platesFor(w); return { unit, bar: barW(), per_side: r.out, loads_exactly: Math.abs(r.made - w) < 0.01, closest_total: r.made, next_action: 'Say the plates per side in one sentence. Stop.' }; }
    });
    reg({
      name: 'rest_timer', description: 'Starts a free rest timer at the top of the display.',
      inputSchema: { type: 'object', properties: { seconds: { type: 'number', description: '10 to 900' } }, required: ['seconds'] },
      async execute(input) { const s = Number(input && input.seconds); if (!(s >= 10 && s <= 900)) return { error: 'out_of_range' }; startTimer(Math.round(s), t().rest, 'free'); renderTimerbar(); return { started_seconds: Math.round(s), next_action: 'Confirm in one short sentence. Stop.' }; }
    });
    if (sess && sess.type === 'sets') {
      reg({
        name: 'set_log', description: 'Logs the current set when the user says how many reps they did ("done 8", "fatte 8 a 60"). Then the rest timer starts.',
        inputSchema: { type: 'object', properties: { reps: { type: 'number', description: 'Reps completed (for timed holds, seconds).' }, weight: { type: 'number', description: `Optional weight actually used, in ${unit}.` } }, required: ['reps'] },
        async execute(input) {
          const r = Math.round(Number(input && input.reps));
          if (!(r >= 0 && r <= 100)) return { error: 'bad_reps' };
          const w = input && input.weight != null ? Number(input.weight) : null;
          const s = curSet(); if (!s) return { error: 'no_set' };
          if (w != null && s.w != null && w > 0) { s.w = w; }
          logSet(r);
          return { logged: { reps: r, weight: s.w != null ? fmtW(s.w) : null }, ...status(), next_action: 'Confirm in two or three words. Stop.' };
        }
      });
      reg({
        name: 'weight_adjust', description: 'Changes the weight of the current exercise by a number of steps (the app step is 2.5 kg / 5 lb for barbells) or to an exact value. Later sets follow.',
        inputSchema: { type: 'object', properties: { steps: { type: 'number', description: 'e.g. 1 or -1' }, exact: { type: 'number', description: `Exact weight in ${unit}` } } },
        async execute(input) {
          const s = curSet(); if (!s || s.w == null) return { error: 'no_weight' };
          if (input && Number(input.exact) > 0) { const d = (Number(input.exact) - s.w) / (STEP[exB(s.ex).eq] || STEP.barbell)[unit]; adjustWeight(d); }
          else adjustWeight(Math.round(Number(input && input.steps) || 0));
          if (cur().s === 'set') render(activeId());
          return { weight: fmtW(curSet().w), next_action: 'Confirm in one short sentence. Stop.' };
        }
      });
      reg({ name: 'rest_add', description: 'Adds seconds to the rest timer that is running.', inputSchema: { type: 'object', properties: { seconds: { type: 'number' } }, required: ['seconds'] }, async execute(input) { const tm = workTimer(); if (!tm || tm.kind !== 'rest') return { error: 'not_resting' }; addRest(Math.max(5, Math.min(300, Number(input && input.seconds) || 30))); return { seconds_left: Math.ceil(tm.remaining), next_action: 'Stop.' }; } });
      reg({ name: 'rest_skip', description: 'Ends the rest now and shows the next set.', async execute() { if (cur().s !== 'rest') return { error: 'not_resting' }; skipRest(); return { ...status(), next_action: 'Stop.' }; } });
      reg({ name: 'exercise_skip', description: 'Skips the rest of the current exercise (for example when the machine is taken).', async execute() { skipExercise(); return { ...status(), next_action: 'Say the new exercise in a few words. Stop.' }; } });
    }
  }

  // ---------- Avvio ----------
  document.documentElement.lang = lang;
  if (!accepted) stack = [{ s: 'welcome' }];
  loadCore().catch(() => {});
  // un recupero o una tenuta interrotti da un ricaricamento ripartono dalla serie
  if (sess && sess.type === 'interval' && (cur().s === 'interval')) loadCore().then(() => startInterval()).catch(() => {});
  if (cur().s === 'rest') stack[stack.length - 1] = { s: 'set' };
  render();
  if (navigator.wakeLock && navigator.wakeLock.request) navigator.wakeLock.request('screen').catch(() => {});
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
