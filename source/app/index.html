<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SousView: un ricettario completo sugli occhiali, passo passo, con timer automatici, menù, lista della spesa e porzioni che si ricalcolano.">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>SousView</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;800&family=Fraunces:opsz,wght,SOFT@9..144,600..900,0..100&display=swap">
<style>
  * { box-sizing: border-box; }
  :root {
    /* Display additivo: il nero è trasparente, quindi tutta la palette è luce. */
    --ink: #F5F1E8;
    --quiet: #ABA497;
    --saffron: #FFC23D;   /* tempo e calore: timer, minuti, tacche */
    --rad: #FF7A1A;       /* paprika: marchio, focus, azione principale */
    --basil: #9BE36B;     /* diete, fatto in casa, spunte */
    --line: rgba(245, 241, 232, 0.24);
    --surface: rgba(245, 241, 232, 0.055);
    --dim: rgba(245, 241, 232, 0.2);
    --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
    --sans: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: clamp(15px, 4.1vmin, 30px);
    color-scheme: dark;
  }
  html, body, #app { inline-size: 100%; block-size: 100%; }
  body {
    margin: 0; min-inline-size: 0; overflow: hidden;
    background: #000; color: var(--ink);
    font-family: var(--sans); line-height: 1.3;
    -webkit-font-smoothing: antialiased;
  }
  .shell {
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr) auto;
    grid-template-areas: 'h' 'r' 'c' 'f';
    inline-size: 100%; block-size: 100%;
    padding: 4vmin 5vmin; gap: 0;
    overflow: hidden;
  }
  header { grid-area: h; margin-block-end: 2vmin; display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; min-inline-size: 0; min-block-size: 1.35rem; }
  .brand { display: flex; align-items: center; gap: 0.35rem; flex: none; font-family: var(--serif); font-weight: 800; font-variation-settings: 'SOFT' 100; font-size: 0.9rem; color: var(--rad); white-space: nowrap; }
  .brand .pot { inline-size: 1.25rem; block-size: 1.25rem; flex: none; }
  .hl { display: flex; align-items: center; gap: 0.5rem; flex: none; }
  button.back { inline-size: auto; min-block-size: 1.9rem; margin: 0; padding: 0.2rem 0.65rem 0.2rem 0.4rem; gap: 0.25rem; border-radius: 2rem; font-size: 0.74rem; flex: none; }
  button.back .ic { inline-size: 1rem; block-size: 1rem; stroke-width: 2.8; color: var(--ink); }
  button.back[hidden] { display: none; }
  .timing .brand-word, .timing .back span { display: none; }
  .timers { display: flex; gap: 0.35rem; flex-wrap: wrap; justify-content: flex-end; min-inline-size: 0; flex: 1 1 auto; }
  .timer {
    display: inline-flex; align-items: center; gap: 0.3rem;
    padding: 0.1rem 0.55rem; border-radius: 2rem;
    border: 2px solid var(--saffron); color: var(--saffron);
    font-size: 0.7rem; font-weight: 800; font-variant-numeric: tabular-nums;
    white-space: nowrap; max-inline-size: 100%; overflow: hidden; text-overflow: ellipsis;
  }
  .timer.cur { background: var(--saffron); color: #000; }
  .timer.paused { border-style: dashed; }
  .timer.cur.paused { background: transparent; color: var(--saffron); }
  .timer.done { background: var(--rad); border-color: var(--rad); color: #000; animation: blink 0.8s steps(2) infinite; }
  .timer .now { inline-size: 0.45rem; block-size: 0.45rem; border-radius: 50%; background: currentColor; flex: none; }
  @keyframes blink { 50% { opacity: 0.35; } }
  #ring { grid-area: r; display: grid; gap: 0.35rem; margin-block-end: 2vmin; }
  #ring:empty { display: none; }
  .content { grid-area: c; min-block-size: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding: 7px 8px; margin: -7px -8px; }
  .content::-webkit-scrollbar { display: none; }
  footer { grid-area: f; display: flex; gap: 0.55rem; margin-block-start: 2vmin; }
  footer button { inline-size: auto; flex: 1 1 auto; justify-content: center; text-align: center; margin: 0; }
  footer #prev { flex: 0 0 3.6rem; }
  #ring button { margin: 0; background: var(--rad); border-color: var(--rad); color: #000; animation: blink 0.8s steps(2) infinite; }
  #ring button * { color: #000; }
  #ring button .ic { stroke: #000; }
  #ring button:focus { animation: none; }
  footer:empty { display: none; }

  h1 { font-family: var(--serif); font-weight: 800; font-variation-settings: 'SOFT' 100; font-size: 1.42rem; line-height: 1.05; letter-spacing: -0.01em; margin: 0.05rem 0 0.4rem; overflow-wrap: break-word; hyphens: auto; }
  h1.hero { font-size: 1.75rem; margin-block-end: 0.55rem; }
  h1 .ic { inline-size: 1.3rem; block-size: 1.3rem; color: var(--rad); vertical-align: -0.12em; margin-inline-end: 0.35rem; }
  h2 { font-size: 0.78rem; font-weight: 800; color: var(--quiet); margin: 1rem 0 0.45rem; }
  p { margin: 0 0 0.5rem; }
  .meta { color: var(--quiet); font-size: 0.74rem; }
  .intro { font-size: 0.84rem; margin-block-end: 0.55rem; }
  .ic { inline-size: 1.2rem; block-size: 1.2rem; flex: none; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }

  button, input, textarea { font: inherit; color: inherit; }
  button {
    display: flex; align-items: center; gap: 0.6rem;
    inline-size: 100%; min-block-size: 2.3rem;
    text-align: start; padding: 0.5rem 0.8rem;
    border-radius: 0.85rem; border: 2px solid var(--line); background: var(--surface);
    font-size: 0.88rem; font-weight: 700; color: var(--ink);
    cursor: pointer; margin: 0 0 0.45rem;
    -webkit-tap-highlight-color: transparent;
  }
  button .grow { flex: 1; min-inline-size: 0; overflow-wrap: break-word; }
  button .sub { display: block; font-weight: 400; font-size: 0.68rem; color: var(--quiet); margin-block-start: 0.05rem; }
  button > .ic { color: var(--rad); }
  button.primary { border: 3px solid var(--rad); color: var(--rad); justify-content: center; }
  button.primary .ic { inline-size: 1rem; block-size: 1rem; fill: currentColor; stroke: none; }
  button.feat { padding-block: 0.6rem; }
  button.feat .grow { font-family: var(--serif); font-variation-settings: 'SOFT' 100; font-size: 1.02rem; font-weight: 800; }
  button.feat .sub { font-family: var(--sans); }
  button.feat > .ic { inline-size: 1.7rem; block-size: 1.7rem; }

  /* Il focus: una lastra radicchio con il testo ritagliato in nero, più un anello chiaro. */
  button:focus { outline: 3px solid var(--ink); outline-offset: 3px; background: var(--rad); border-color: var(--rad); color: #000; }
  button:focus * { color: #000 !important; } /* il testo ritagliato vince su ogni colore di dettaglio */
  button:focus .ic { stroke: #000; }
  button:focus .dial { --on: #000; --off: rgba(0, 0, 0, 0.3); --now: #000; }
  input:focus, textarea:focus { outline: 3px solid var(--rad); outline-offset: 2px; border-color: var(--rad); }

  /* La firma: il quadrante a tacche, come un contaminuti da cucina. */
  .dial line { stroke: var(--off, rgba(245, 241, 232, 0.2)); stroke-width: 5.5; stroke-linecap: round; }
  .dial line.on { stroke: var(--on, var(--saffron)); }
  .dial line.now { stroke: var(--now, var(--rad)); stroke-width: 8; }
  .dw { position: relative; inline-size: 2.5rem; block-size: 2.5rem; flex: none; display: grid; place-items: center; }
  .dw .dial { position: absolute; inset: 0; inline-size: 100%; block-size: 100%; }
  .dw b { position: relative; font-size: 0.66rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--saffron); }

  .search { position: relative; margin: 0 0 0.5rem; }
  .search .ic { position: absolute; inset-inline-start: 0.75rem; inset-block-start: 50%; transform: translateY(-50%); color: var(--quiet); pointer-events: none; }
  input, textarea { inline-size: 100%; background: var(--surface); border: 2px solid var(--line); border-radius: 0.85rem; padding: 0.5rem 0.75rem; font-size: 0.86rem; min-block-size: 2.3rem; }
  .search input { padding-inline-start: 2.35rem; }
  input[type=search]::-webkit-search-cancel-button { display: none; }
  textarea { min-block-size: 4.2em; resize: none; }
  label { display: block; font-size: 0.74rem; color: var(--quiet); margin: 0.55rem 0 0.25rem; }

  .strip > .ic { color: var(--quiet); }
  .chips { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-block-start: 0.2rem; }
  .chip { font-size: 0.64rem; font-weight: 800; color: var(--basil); border: 1.5px solid var(--basil); border-radius: 2rem; padding: 0.02rem 0.45rem; }
  button:focus .chip { border-color: #000; }

  .sec-h { display: flex; align-items: center; gap: 0.5rem; margin: 0.95rem 0 0.45rem; font-size: 0.78rem; font-weight: 800; color: var(--quiet); }
  .sec-h .dial { inline-size: 1.55rem; block-size: 1.55rem; flex: none; }

  .rrow { gap: 0.7rem; padding: 0.42rem 0.75rem 0.42rem 0.5rem; }
  .rrow .rt { display: block; font-size: 0.86rem; line-height: 1.18; }
  .rrow.pick .rt { font-family: var(--serif); font-variation-settings: 'SOFT' 100; font-size: 1rem; font-weight: 800; line-height: 1.1; }
  .rm { display: flex; flex-wrap: wrap; align-items: center; gap: 0.12rem 0.55rem; font-size: 0.66rem; color: var(--quiet); font-weight: 600; margin-block-start: 0.12rem; }
  .dg { display: inline-flex; gap: 0.2rem; color: var(--basil); }
  .dg .ic { inline-size: 0.95rem; block-size: 0.95rem; stroke-width: 2.6; }
  .alc { color: var(--saffron); display: inline-flex; }
  .alc .ic { inline-size: 0.95rem; block-size: 0.95rem; }
  .yours { font-size: 0.6rem; font-weight: 800; color: var(--basil); border: 1.5px solid var(--basil); border-radius: 2rem; padding: 0 0.4rem; }

  .cats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.45rem; }
  .cats button { margin: 0; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 0.3rem; min-block-size: 4.3rem; padding: 0.5rem 0.55rem; position: relative; }
  .cats .ic { inline-size: 1.5rem; block-size: 1.5rem; color: var(--rad); }
  .cats .nm { font-size: 0.7rem; line-height: 1.12; hyphens: auto; overflow-wrap: anywhere; }
  .cats .ct { position: absolute; inset-block-start: 0.45rem; inset-inline-end: 0.55rem; font-size: 0.64rem; font-weight: 800; color: var(--saffron); font-variant-numeric: tabular-nums; }
  .cats button.zero { opacity: 0.5; }
  .cats button.zero:focus { opacity: 1; }

  .subrow .cnt, .count { flex: none; min-inline-size: 1.8rem; text-align: center; font-size: 0.72rem; font-weight: 800; color: var(--saffron); border: 2px solid var(--saffron); border-radius: 2rem; padding: 0 0.4rem; font-variant-numeric: tabular-nums; }
  button:focus .cnt { border-color: #000; }
  .subrow.zero { opacity: 0.5; }
  .subrow.zero:focus { opacity: 1; }

  .state { display: grid; justify-items: center; text-align: center; gap: 0.6rem; padding: 1.2rem 0.4rem; color: var(--quiet); font-size: 0.82rem; }
  .state .dial { inline-size: 3rem; block-size: 3rem; }
  .spin { animation: spin 1.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .state button { inline-size: auto; padding-inline: 1.4rem; justify-content: center; }
  .empty { color: var(--quiet); font-size: 0.82rem; margin: 0.5rem 0 0.7rem; }

  .facts { display: flex; flex-wrap: wrap; align-items: center; gap: 0.45rem 1rem; margin: 0.15rem 0 0.5rem; }
  .fact { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; font-weight: 800; }
  .fact small { display: block; font-size: 0.62rem; color: var(--quiet); font-weight: 600; }
  .fact .dw { inline-size: 2.1rem; block-size: 2.1rem; }
  .pips { display: inline-flex; gap: 0.18rem; }
  .pips i { inline-size: 0.45rem; block-size: 0.45rem; border-radius: 50%; border: 2px solid var(--saffron); }
  .pips i.on { background: var(--saffron); }
  .badges { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.1rem 0 0.55rem; }
  .badge { display: inline-flex; align-items: center; gap: 0.25rem; font-size: 0.66rem; font-weight: 800; color: var(--basil); border: 1.5px solid var(--basil); border-radius: 2rem; padding: 0.08rem 0.5rem 0.08rem 0.35rem; }
  .badge .ic { inline-size: 0.9rem; block-size: 0.9rem; }
  .badge.warn { color: var(--saffron); border-color: var(--saffron); }
  .badge.plain { color: var(--quiet); border-color: var(--dim); }
  .seasonrow { display: flex; align-items: center; gap: 0.5rem; font-size: 0.72rem; color: var(--quiet); font-weight: 700; margin: 0 0 0.5rem; }
  .seasonrow .dial { inline-size: 1.6rem; block-size: 1.6rem; flex: none; --on: var(--basil); }

  .servings { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 0.6rem; margin: 0.3rem 0 0.2rem; }
  .servings button { justify-content: center; margin: 0; font-size: 1.15rem; }
  .servings output { font-size: 0.92rem; font-weight: 800; text-align: center; min-inline-size: 5.5em; }

  .seg { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.35rem 0 0.2rem; }
  .seg button { margin: 0; flex: 1 1 auto; inline-size: auto; justify-content: center; text-align: center; font-size: 0.72rem; min-block-size: 2rem; padding: 0.3rem 0.6rem; gap: 0.35rem; }
  .seg button .ic { inline-size: 1rem; block-size: 1rem; color: var(--quiet); }
  .seg button[aria-pressed=true] { border-color: var(--basil); color: var(--basil); background: rgba(155, 227, 107, 0.1); }
  .seg button[aria-pressed=true] .ic { color: var(--basil); }
  .seg button:focus { background: var(--rad); border-color: var(--rad); color: #000; }

  ul.ing { list-style: none; margin: 0; padding: 0; }
  ul.ing > li { padding: 0.3rem 0; border-block-end: 1px solid rgba(245, 241, 232, 0.1); font-size: 0.84rem; }
  .li { display: flex; gap: 0.6rem; }
  .q { color: var(--saffron); font-weight: 800; min-inline-size: 5.4em; flex: none; font-variant-numeric: tabular-nums; }
  .nest { margin: 0.35rem 0 0.15rem; padding-inline-start: 0.7rem; border-inline-start: 3px solid var(--basil); }
  .nest .nh { font-size: 0.7rem; color: var(--basil); font-weight: 800; margin-block-end: 0.15rem; }
  .nest ul { list-style: none; margin: 0; padding: 0; }
  .nest li { font-size: 0.76rem; padding: 0.12rem 0; }
  .nest .q { min-inline-size: 5em; }

  .tip { display: block; text-align: start; padding: 0.5rem 0.75rem; border: 0; border-inline-start: 3px solid var(--saffron); border-radius: 0 0.85rem 0.85rem 0; background: var(--surface); margin: 0 0 0.45rem; }
  button.tip { border: 2px solid var(--line); border-inline-start: 3px solid var(--saffron); }
  .tip .tk { display: flex; align-items: center; gap: 0.35rem; font-size: 0.66rem; font-weight: 800; color: var(--saffron); }
  .tip .tk .ic { inline-size: 1rem; block-size: 1rem; color: var(--saffron); }
  .tip .tt { display: block; font-size: 0.8rem; font-weight: 600; margin-block-start: 0.15rem; line-height: 1.3; }
  .tip .tl { display: flex; align-items: center; gap: 0.3rem; color: var(--rad); font-size: 0.72rem; font-weight: 800; margin-block-start: 0.3rem; }
  .tip .tl .ic { inline-size: 0.8rem; block-size: 0.8rem; fill: currentColor; stroke: none; }
  button.tip:focus { border-color: var(--rad); }

  .cook-h { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; font-size: 0.72rem; font-weight: 800; color: var(--quiet); }
  .cook-h .meth { display: inline-flex; align-items: center; gap: 0.3rem; color: var(--saffron); min-inline-size: 0; }
  .cook-h .meth .ic { inline-size: 1rem; block-size: 1rem; }
  .phase { display: flex; align-items: center; gap: 0.45rem; margin-block-start: 0.25rem; color: var(--rad); font-family: var(--serif); font-variation-settings: 'SOFT' 100; font-weight: 800; font-size: 0.86rem; line-height: 1.1; }
  .phase .pn { display: grid; place-items: center; flex: none; inline-size: 1.3rem; block-size: 1.3rem; border-radius: 50%; background: var(--rad); color: #000; font-family: var(--sans); font-size: 0.7rem; }
  .phase.plain { color: var(--quiet); }
  .ticks { display: flex; gap: 3px; align-items: center; margin: 0.45rem 0 0.7rem; block-size: 0.8rem; }
  .ticks i { flex: 1; block-size: 0.45rem; border-radius: 2px; background: var(--dim); }
  .ticks i.on { background: var(--rad); }
  .ticks i.cur { block-size: 0.8rem; background: var(--ink); }
  .ticks i.gap { margin-inline-start: 0.45rem; }
  .steptext { font-size: 1.22rem; line-height: 1.3; font-weight: 600; }
  .steptext.long { font-size: 1.08rem; }
  .big-timer { display: flex; align-items: center; gap: 0.9rem; margin-block-start: 0.8rem; }
  .big-timer .dw { inline-size: 6rem; block-size: 6rem; }
  .big-timer .dw b { font-size: 1.3rem; }
  .big-timer .dial line { stroke-width: 2.6; }
  .big-timer .dw b.hms { font-size: 0.95rem; }
  .big-timer .lbl { font-size: 0.86rem; font-weight: 800; }
  .big-timer .lbl small { display: block; color: var(--quiet); font-weight: 600; font-size: 0.72rem; margin-block-start: 0.1rem; }
  .big-timer.done .dial { --on: var(--rad); }
  .big-timer.done .dw b { color: var(--rad); animation: blink 0.8s steps(2) infinite; }
  .bgnote { display: inline-flex; align-items: center; gap: 0.3rem; color: var(--saffron); }

  .done-hero { text-align: center; padding-block-start: 0.4rem; }
  .done-hero .dw { inline-size: 5rem; block-size: 5rem; margin: 0 auto 0.5rem; }
  .done-hero .dial { --on: var(--rad); }
  .done-hero .dial line { stroke-width: 2.6; }
  .done-hero .dw .ic { position: relative; inline-size: 2rem; block-size: 2rem; color: var(--rad); stroke-width: 3; }
  .note { border-inline-start: 3px solid var(--saffron); padding: 0.2rem 0 0.2rem 0.7rem; font-size: 0.8rem; margin: 0.6rem 0; text-align: start; }
  .hint { font-size: 0.72rem; color: var(--quiet); margin: 0.5rem 0; }

  .fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.4rem; }
  .fgrid button { margin: 0; }
  .box { inline-size: 1.2rem; block-size: 1.2rem; border: 2px solid var(--quiet); border-radius: 0.35rem; flex: none; display: grid; place-items: center; }
  .box .ic { inline-size: 0.9rem; block-size: 0.9rem; opacity: 0; stroke-width: 3.2; }
  [aria-pressed=true] > .box { background: var(--basil); border-color: var(--basil); }
  [aria-pressed=true] > .box .ic { opacity: 1; stroke: #000; }
  button:focus > .box { border-color: #000; }
  button:focus[aria-pressed=true] > .box { background: #000; }
  button:focus[aria-pressed=true] > .box .ic { stroke: var(--rad); }

  .roles { display: flex; flex-wrap: wrap; align-items: center; gap: 0.1rem 0; margin-block-start: 0.2rem; font-size: 0.64rem; font-weight: 700; color: var(--quiet); font-family: var(--sans); }
  .roles span + span::before { content: ''; display: inline-block; inline-size: 2px; block-size: 0.7em; background: var(--saffron); margin-inline: 0.4rem; vertical-align: -0.05em; }
  button:focus .roles span + span::before { background: #000; }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 0.45rem; margin-block-start: 0.5rem; }
  .acts button { margin: 0; }
  .course .ri { display: block; font-size: 0.68rem; line-height: 1.25; color: var(--ink); opacity: 0.8; margin-block-start: 0.12rem; }
  .course .role { display: block; font-size: 0.64rem; color: var(--rad); font-weight: 800; margin-block-end: 0.05rem; }
  .pairing { border: 2px solid var(--saffron); border-radius: 1rem; padding: 0.6rem 0.85rem 0.7rem; margin: 0.9rem 0 0.4rem; background: rgba(255, 194, 61, 0.08); }
  .pairing .ph { display: flex; align-items: center; gap: 0.4rem; color: var(--saffron); font-weight: 800; font-size: 0.74rem; }
  .pairing p { font-family: var(--serif); font-variation-settings: 'SOFT' 100; font-size: 0.98rem; font-weight: 700; margin: 0.3rem 0 0; line-height: 1.25; }
  ol.plan { list-style: none; margin: 0; padding: 0; counter-reset: p; }
  ol.plan li { position: relative; padding: 0.05rem 0 0.75rem 2rem; font-size: 0.8rem; counter-increment: p; }
  ol.plan li::before { content: counter(p); position: absolute; inset-inline-start: 0; inset-block-start: 0; inline-size: 1.3rem; block-size: 1.3rem; border-radius: 50%; border: 2px solid var(--saffron); color: var(--saffron); display: grid; place-items: center; font-size: 0.64rem; font-weight: 800; }
  ol.plan li::after { content: ''; position: absolute; inset-inline-start: calc(0.65rem - 1px); inset-block: 1.3rem 0; inline-size: 2px; background: var(--dim); }
  ol.plan li:last-child::after { display: none; }
  ol.plan li:last-child::before { background: var(--saffron); color: #000; }

  .si .nm { flex: 1; min-inline-size: 0; font-weight: 600; font-size: 0.84rem; overflow-wrap: break-word; }
  .si .qt { flex: none; color: var(--saffron); font-weight: 800; font-size: 0.78rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .si[aria-pressed=true] .nm { text-decoration: line-through; color: var(--quiet); }
  .si[aria-pressed=true] .qt { color: var(--quiet); }
  .si:focus .nm, .si:focus .qt { color: #000; }
  .si { padding-block: 0.38rem; min-block-size: 2.1rem; }
  .shophead { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
  .progress-note { font-size: 0.72rem; color: var(--basil); font-weight: 800; }

  .langs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.45rem; margin-block-end: 0.9rem; }
  .langs button { margin: 0; padding: 0.55rem 0.7rem; }
  .langs button.on { border-color: var(--basil); color: var(--basil); }
  .langs button.on::after { content: ''; flex: none; margin-inline-start: auto; inline-size: 0.5rem; block-size: 0.5rem; border-radius: 50%; background: var(--basil); }
  .langs button.on:focus { color: #000; }
  .langs button.on:focus::after { background: #000; }

  .toast {
    position: fixed; inset-inline: 6vmin; inset-block-end: 6vmin;
    background: #000; border: 2px solid var(--rad); color: var(--ink);
    padding: 0.5rem 0.8rem; border-radius: 0.85rem; font-size: 0.8rem; font-weight: 700;
    opacity: 0; transition: opacity 0.2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .sr { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

  // ---------- Archivio locale (può fallire: lo gestiamo) ----------
  const mkStore = (getS) => ({
    get(key, fallback) { try { const v = getS().getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } },
    set(key, value) { try { getS().setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; } }
  });
  const store = mkStore(() => localStorage);
  const session = mkStore(() => sessionStorage);

  function detectLang() {
    try { const saved = localStorage.getItem('sv_lang'); if (T[saved]) return saved; } catch (e) { /* niente archivio: si va avanti */ }
    const list = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || '']);
    for (const l of list) { const k = String(l).slice(0, 2).toLowerCase(); if (T[k]) return k; }
    return 'en';
  }
  let lang = detectLang();
  const t = () => T[lang];

  // ---------- Unità ----------
  const UNIT_RE = /^(cuill[eè]res?\s[àa]\s(?:soupe|caf[ée])|c\.\s?[àa]\s?[sc]\.?|cucchiaini|cucchiaino|cucchiai|cucchiaio|bicchieri|bicchiere|tablespoons?|teaspoons?|tbsp|tbs|tsp|cucharaditas?|cucharadas?|e(?:ss|ß)l[oö]ffel|teel[oö]ffel|el|tl|grammi|grammes?|gramm|grams?|gramos?|gr|g|kg|ml|cl|dl|litri|litro|litres?|liters?|litros?|liter|l)\.?(?=\s|$)/i;
  function unitInfo(word) {
    const s = String(word || '').toLowerCase().replace(/\s+/g, ' ').trim();
    if (!s) return ['', 1];
    if (/^(g|gr|grammi|grammo|grammes?|gramm|grams?|gramos?)\.?$/.test(s)) return ['g', 1];
    if (s === 'kg') return ['g', 1000];
    if (s === 'ml') return ['ml', 1];
    if (s === 'cl') return ['ml', 10];
    if (s === 'dl') return ['ml', 100];
    if (s === 'pinch') return ['pinch', 1];
    if (/^(l|litri|litro|litres?|liters?|litros?|liter)$/.test(s)) return ['ml', 1000];
    if (/^(tbsp|tbs|cucchiai|cucchiaio|tablespoons?|c\. ?[àa] ?s\.?|cuill[eè]res? [àa] soupe|cucharadas?|el|e(ss|ß)l[oö]ffel)\.?$/.test(s)) return ['tbsp', 1];
    if (/^(tsp|cucchiaini|cucchiaino|teaspoons?|c\. ?[àa] ?c\.?|cuill[eè]res? [àa] caf[ée]|cucharaditas?|tl|teel[oö]ffel)\.?$/.test(s)) return ['tsp', 1];
    return [s, 1]; // unità libera di una vecchia ricetta (es. "bicchiere"): si mostra com'è
  }
  function normalizeMine(list) {
    if (!Array.isArray(list)) return [];
    return list.filter((r) => r && typeof r === 'object' && r.id && Array.isArray(r.steps) && Array.isArray(r.ingredients)).map((r) => ({
      ...r,
      title: String(r.title || r.id),
      servings: Math.max(1, parseInt(r.servings, 10) || 2),
      steps: r.steps.filter((s) => s && typeof s.t === 'string'),
      ingredients: r.ingredients.filter(Boolean).map((i) => {
        const [u, f] = unitInfo(i.u);
        return { ...i, n: String(i.n || ''), u, q: typeof i.q === 'number' ? i.q * f : null, ...(Array.isArray(i.f) && i.f.length === 2 ? { f: i.f.map(String) } : { f: undefined }) };
      })
    }));
  }

  let mine = normalizeMine(store.get('sv_mine', []));
  let voiceOn = store.get('sv_voice', true) !== false;
  const saveMine = () => store.set('sv_mine', mine);
  let makeChoice = store.get('sv_make', {}) || {};
  let methodChoice = store.get('sv_method', {}) || {};
  let shopTicks = store.get('sv_shop', {}) || {};

  // ---------- Utilità ----------
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ß/g, 'ss').replace(/[^a-z0-9]+/g, ' ').trim();
  const fmtClock = (sec) => {
    sec = Math.max(0, Math.ceil(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
  };
  const fmtNum = (v) => {
    try { return new Intl.NumberFormat(lang, { maximumFractionDigits: 1, useGrouping: false }).format(v); } catch (e) { return String(v); }
  };
  const MONTH = new Date().getMonth() + 1;
  const monthName = (m) => {
    try { return new Intl.DateTimeFormat(lang, { month: 'long' }).format(new Date(2026, (m || MONTH) - 1, 15)); } catch (e) { return ''; }
  };
  const monthShort = (m) => {
    try { return new Intl.DateTimeFormat(lang, { month: 'short' }).format(new Date(2026, m - 1, 15)).replace(/\.$/, ''); } catch (e) { return String(m); }
  };
  const fmtMin = (m) => {
    const L = t();
    if (m < 60) return `${m} ${L.min}`;
    const h = Math.floor(m / 60), r = m % 60;
    return r ? `${h} h ${r} ${L.min}` : `${h} h`;
  };
  const fmtQty = (q, u) => {
    if (q == null) return '';
    if (u === 'g' || u === 'ml') {
      if (q >= 1000 && q % 100 === 0) return fmtNum(q / 1000) + (u === 'g' ? ' kg' : ' l');
      const v = q >= 100 ? Math.round(q / 10) * 10 : q >= 10 ? Math.round(q / 5) * 5 : Math.round(q * 10) / 10;
      return fmtNum(v) + ' ' + u;
    }
    let v = Math.round(q * 2) / 2;
    if (v === 0 && q > 0) v = 0.5;
    const whole = Math.floor(v), half = v - whole >= 0.5;
    const txt = half ? (whole ? whole + '½' : '½') : fmtNum(whole);
    const unit = t().unit[u] ? t().unit[u](v) : u;
    return unit ? txt + ' ' + unit : txt;
  };
  let toastTimer = 0;
  const $toast = document.getElementById('toast');
  const toast = (msg) => {
    $toast.textContent = msg;
    $toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $toast.classList.remove('show'), 2600);
  };
  const speak = (text) => {
    if (!voiceOn) return;
    if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) return;
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = VOICE[lang];
      window.speechSynthesis.speak(u);
    } catch (e) { /* la voce è un extra: il testo resta a schermo */ }
  };
  // Durate in italiano, inglese, francese, spagnolo e tedesco.
  const parseTimer = (text) => {
    const h = String(text).match(/(\d+(?:[.,]\d+)?)\s*(?:ore|ora|hours?|hrs?|h|heures?|horas?|stunden|stunde|std)\b/i);
    const m = String(text).match(/(\d+(?:[.,]\d+)?)\s*(?:minuti|minuto|minutes?|mins?|minutos|minuten|min|mn)\b/i);
    let sec = 0;
    if (h) sec += parseFloat(h[1].replace(',', '.')) * 3600;

      ${filters.length ? `<div style="margin-top:0.8rem">${btn('f-clear', esc(L.clearFilters), '')}</div>` : ''}`;
    $footer.innerHTML = btn('f-done', esc(L.showN(n)), '', 'primary');
    defs.forEach((f) => on('f-' + f.id, () => {
      setFilters(filters.includes(f.id) ? filters.filter((k) => k !== f.id) : filters.concat(f.id));
      render('f-' + f.id);
    }));
    on('f-clear', () => { setFilters([]); render(defs[0] ? 'f-' + defs[0].id : 'f-done'); });
    on('f-done', () => goBack());
    return defs[0] ? 'f-' + defs[0].id : 'f-done';
  }

  function renderCat() {
    const L = t();
    if (!coreReady()) return null;
    const e = cur(), c = catOf(e.c);
    if (!c) return renderHome();
    $content.innerHTML = `<h1>${icon(IC[c.id] ? c.id : 'primi')}${esc(nm(c))}</h1>${strip()}<h2>${esc(L.recipesN(countFor((x) => x.c === c.id)))}</h2>
      ${c.subs.map((s) => {
        const n = countFor((x) => x.c === c.id && x.s === s.id);
        return `<button type="button" id="sub-${s.id}" class="subrow${n ? '' : ' zero'}" aria-label="${esc(nm(s) + ', ' + L.recipesN(n))}"><span class="grow">${esc(nm(s))}</span><span class="cnt">${n}</span></button>`;

  // ---------- Cucine del mondo ----------
  // Una cucina per paese d'origine; quelle con meno di 3 ricette finiscono in "Altre cucine" (codice XX).
  function cuisineGroups() {
    const n = new Map();
    D.idx.forEach((x) => { if (x.o) n.set(x.o, (n.get(x.o) || 0) + 1); });
    const main = [...n].filter(([, c]) => c >= 3).sort((a, b) => b[1] - a[1] || region(a[0]).localeCompare(region(b[0]), lang));
    const other = [...n].filter(([, c]) => c < 3).map(([o]) => o);
    return { main, other, otherN: other.reduce((a, o) => a + n.get(o), 0) };
  }
  const PROT = ['all', 'meat', 'poultry', 'fish', 'veg', 'vegan'];
  const protOk = (x, f) => f === 'all' || !f ? true : f === 'veg' ? x.d.includes('veg') && !x.d.includes('vegan') : f === 'vegan' ? x.d.includes('vegan') : (x.p || []).includes(f);
  function renderCuisines() {
    const L = t();
    if (!coreReady()) return null;
    const g = cuisineGroups();
    let h = `<h1>${icon('world')}${esc(L.cuisines)}</h1>`;
    h += g.main.map(([o, c]) => btn('cu-' + o, esc(region(o)), esc(L.recipesN(c)))).join('');
    if (g.other.length) h += btn('cu-XX', esc(L.otherCuisines), esc(L.recipesN(g.otherN)));
    $content.innerHTML = h;
    $footer.innerHTML = '';
    g.main.forEach(([o]) => on('cu-' + o, () => go({ s: 'cuisine', o, f: 'all' })));
    on('cu-XX', () => go({ s: 'cuisine', o: 'XX', f: 'all' }));
    return g.main.length ? 'cu-' + g.main[0][0] : null;
  }
  function renderCuisine() {
    const L = t();
    if (!coreReady()) return null;
    const e = cur(), g = cuisineGroups();
    const inC = (x) => (e.o === 'XX' ? g.other.includes(x.o) : x.o === e.o);
    const all = D.idx.filter(inC);
    if (!all.length) return renderCuisines();
    const f = PROT.includes(e.f) ? e.f : 'all';
    const avail = PROT.filter((k) => k === 'all' || all.some((x) => protOk(x, k)));
    const list = all.filter((x) => protOk(x, f));
    let h = `<h1>${esc(e.o === 'XX' ? L.otherCuisines : region(e.o))}</h1><p class="meta">${esc(L.cuisineMeta(all.length))}</p>`;
    if (avail.length > 2) h += `<div class="seg" role="group">${avail.map((k) => `<button type="button" id="pf-${k}" aria-pressed="${k === f}">${esc(L.prot[k])}</button>`).join('')}</div>`;
    if (!list.length) h += `<p class="empty">${esc(L.protEmpty)}</p>`;
    D.tree.cats.forEach((c) => {
      const rows = list.filter((x) => x.c === c.id).sort((a, b) => titleOf(a).localeCompare(titleOf(b), lang));
      if (rows.length) h += `<h2>${esc(nm(c))}</h2>` + rows.map((x) => rowBtn(x, 'r-', '', e.o === 'XX' ? region(x.o) : '')).join('');
    });
    $content.innerHTML = h;
    $footer.innerHTML = '';
    avail.forEach((k) => on('pf-' + k, () => { e.f = k; render('pf-' + k); }));
    bindRows(list, 'r-');
    return avail.length > 2 ? 'pf-' + f : list[0] ? 'r-' + list[0].id : null;
  }

  function renderSub() {
    const L = t();
    if (!coreReady()) return null;
    const e = cur(), c = catOf(e.c), s = subOf(e.c, e.sub);
    if (!c || !s) return renderHome();
    const allHere = D.idx.filter((x) => x.c === c.id && x.s === s.id);
    const list = allHere.filter((x) => passes(x)).sort((a, b) => titleOf(a).localeCompare(titleOf(b), lang));
    let h = `<h1>${esc(nm(s))}</h1>${strip()}`;
    if (list.length) h += `<h2>${esc(L.recipesN(list.length))}</h2>` + list.map((x) => rowBtn(x, 'r-')).join('');
    else if (allHere.length) h += `<p class="empty">${esc(L.emptyFiltered)}</p>` + btn('s-clear', esc(L.clearFilters), esc(L.showN(allHere.length)));
    else h += `<p class="empty">${esc(L.emptySub)}</p>`;
    if (allHere.some((x) => x.a)) h += `<p class="hint">${icon('glass')} ${esc(L.alcohol)}</p>`;
    $content.innerHTML = h;
    $footer.innerHTML = '';
    bindStrip();
    bindRows(list, 'r-');
    on('s-clear', () => { setFilters([]); render(); });
    if (allHere.length) loadSub(c.id, s.id).catch(() => {}); // il file pesante arriva solo adesso, in sottofondo
    return list.length ? 'r-' + list[0].id : allHere.length ? 's-clear' : 'go-filters';
  }

  function scaledIng(r, serv) {
    const k = (serv || r.servings) / r.servings;
    return r.ingredients.map((i) => ({ ...i, q: i.q == null ? null : i.q * k }));
  }
  // Il nome che si accorda col numero: "1 cipolla", "2 cipolle". f = [singolare, plurale] dai dati.
  // In francese 1,5 vuole ancora il singolare ("1½ oignon"); nelle altre lingue si passa al plurale sopra 1.
  const isPlural = (q) => (lang === 'fr' ? q >= 2 : q > 1);
  const ingName = (i, q) => (Array.isArray(i.f) && q != null && !i.u ? (isPlural(q) ? i.f[1] : i.f[0]) : i.n);

  function tipsBlock(r, prefix) {
    const L = t();
    return (r.tips || []).map((tp, i) => {
      const linked = tp.link && D.byId.get(tp.link);
      const inner = `<span class="tk">${icon(tp.k)}${esc(L.tipK[tp.k] || '')}</span><span class="tt">${esc(tp.t)}</span>${linked ? `<span class="tl">${icon('play')}${esc(titleOf(linked))}</span>` : ''}`;
      return linked ? `<button type="button" id="${prefix}${i}" class="tip" aria-label="${esc((L.tipK[tp.k] || '') + ': ' + tp.t + '. ' + L.openLinked + ': ' + titleOf(linked))}">${inner}</button>` : `<div class="tip">${inner}</div>`;
    }).join('');
  }
  function bindTips(r, prefix) { (r.tips || []).forEach((tp, i) => { if (tp.link && D.byId.has(tp.link)) on(prefix + i, () => openRecipe(tp.link)); }); }

  function seasonText(months) {
    if (!months || !months.length || months.length === 12) return '';
    const set = new Set(months), runs = [];
    let start = null;
    for (let k = 0; k < 24; k++) {
      const m = (k % 12) + 1;
      if (set.has(m) && start === null && !set.has(((m + 10) % 12) + 1)) start = m;
      if (start !== null && set.has(m) && !set.has((m % 12) + 1)) { runs.push([start, m]); start = null; if (runs.length >= 3) break; }
    }
    const uniq = [...new Map(runs.map((r) => [r.join('-'), r])).values()];
    return uniq.map(([a, b]) => (a === b ? monthShort(a) : `${monthShort(a)} – ${monthShort(b)}`)).join(', ');
  }

  function renderRecipe() {
    const L = t();
    const e = cur();
    let r = findRecipe(e.id);
    if (!r) {
      if (e.err) return showError();
      need(ensure(e.id));
      return showLoading();
    }
    if (!e.serv) e.serv = r.servings;
    const bases = r.mine ? [] : basesOf(r);
    const missing = bases.filter((b) => !findRecipe(b.id));
    if (missing.length) Promise.all(missing.map((b) => ensure(b.id))).then(() => { if (cur() === e) render(activeId()); }, () => {});
    const x = D.byId.get(r.id);
    const ing = scaledIng(r, e.serv);
    const meth = methodOf(r);
    let h = `<h1>${esc(r.title)}</h1>`;
    if (r.intro) h += `<p class="intro">${esc(scaleText(r.intro, e.serv / r.servings, r.ingredients))}</p>`;
    h += `<div class="facts"><span class="fact">${minDial(r.minutes || 10)}<span>${fmtMin(r.minutes || 10)}</span></span>`;
    if (r.kcal) h += `<span class="fact"><span>${esc(L.kcal(r.kcal))}<small>${esc(L.perServ)}</small></span></span>`;
    if (r.diff) h += `<span class="fact"><span class="pips">${[1, 2, 3].map((n) => `<i class="${n <= r.diff ? 'on' : ''}"></i>`).join('')}</span><span>${esc(L.diffs[r.diff - 1] || '')}</span></span>`;
    h += '</div>';
    const badges = [];
    (r.diet || []).forEach((d) => { if (FX[d] && !((d === 'veg' || d === 'lf') && r.diet.includes('vegan'))) badges.push(`<span class="badge">${icon(d)}${esc(filterName(d))}</span>`); });
    if (r.alcohol || (x && x.a)) badges.push(`<span class="badge warn">${icon('glass')}${esc(L.alcohol)}</span>`);
    if (r.origin && r.origin !== 'IT') badges.push(`<span class="badge plain">${esc(region(r.origin))}</span>`);
    if (badges.length) h += `<div class="badges">${badges.join('')}</div>`;
    const st = seasonText(r.months);
    if (st) h += `<div class="seasonrow">${monthDial(r.months)}<span>${esc(L.seasonLbl)}: ${esc(st)}</span></div>`;
    h += `<div class="servings" role="group" aria-label="${esc(L.servLabel)}">
        <button type="button" id="srv-minus" aria-label="${esc(L.fewer)}">−</button>
        <output id="srv-out">${L.serv(e.serv)}</output>
        <button type="button" id="srv-plus" aria-label="${esc(L.more)}">+</button>
      </div>`;
    if ((r.methods || []).length > 1) {
      h += `<h2>${esc(L.method)}</h2><div class="seg" role="group" aria-label="${esc(L.method)}">${r.methods.map((m) => `<button type="button" id="me-${m}" aria-pressed="${m === meth}">${icon(IC[m] ? m : 'pot')}${esc(methodName(m))}</button>`).join('')}</div>`;
    }
    h += `<div class="acts">${btn('wa-send', esc(L.waSend), esc(L.waRecipe(L.serv(e.serv))), '', 'wa')}${btn('go-shop', esc(L.shop), esc(L.shopFor(L.serv(e.serv))), '', 'cart')}</div>`;
    h += `<h2>${esc(L.ingredients)}</h2><ul class="ing">${ing.map((i, n) => {
      let li = `<div class="li"><span class="q">${esc(fmtQty(i.q, i.u))}</span><span>${esc(ingName(i, i.q))}</span></div>`;
      const b = bases.find((y) => y.n === n);
      if (b) {
        const home = isHome(b.id);
        li += `<div class="seg" role="group" aria-label="${esc(L.makeQ)}"><button type="button" id="mk-${n}-0" aria-pressed="${!home}">${esc(L.store)}</button><button type="button" id="mk-${n}-1" aria-pressed="${home}">${esc(L.homemade)}</button></div>`;
        if (home) {
          const br = findRecipe(b.id);
          if (br) {
            const bi = scaledIng(br, e.serv);
            li += `<div class="nest"><div class="nh">${esc(L.forBase(br.title))}</div><ul>${bi.map((y) => `<li class="li"><span class="q">${esc(fmtQty(y.q, y.u))}</span><span>${esc(ingName(y, y.q))}</span></li>`).join('')}</ul></div>`;
          } else li += `<div class="nest"><div class="nh">${esc(L.loading)}</div></div>`;
        }
      }
      return `<li>${li}</li>`;
    }).join('')}</ul>`;
    if ((r.tips || []).length) h += `<h2>${esc(L.tips)}</h2>${tipsBlock(r, 'tip-')}`;
    h += `<div style="margin-top:0.7rem">
        ${e.serv !== r.servings || !r.mine ? btn('save-mine', L.saveMine, e.serv !== r.servings ? L.saveWith(L.serv(e.serv)) : L.saveLater, '', 'mine') : ''}
        ${r.mine ? btn('delete-mine', L.del, '') : ''}
      </div>`;
    $content.innerHTML = h;
    $footer.innerHTML = `<button type="button" id="start-cook" class="primary">${icon('play')}<span>${esc(L.start)}</span></button>`;
    const setServ = (n) => { e.serv = Math.min(20, Math.max(1, n)); render(activeId()); };
    on('srv-minus', () => setServ(e.serv - 1));
    on('srv-plus', () => setServ(e.serv + 1));
    (r.methods || []).forEach((m) => on('me-' + m, () => { setMethod(r, m); render('me-' + m); }));
    bases.forEach((b) => {
      on(`mk-${b.n}-0`, () => { setHome(b.id, false); render(`mk-${b.n}-0`); });
      on(`mk-${b.n}-1`, () => { setHome(b.id, true); render(`mk-${b.n}-1`); });
    });
    bindTips(r, 'tip-');
    on('go-shop', () => go({ s: 'shop', from: 'recipe', id: r.id, n: e.serv }));
    on('wa-send', () => openWhatsApp(recipeText(r, e)));
    on('start-cook', () => startCook(r, e));
    on('save-mine', () => { const copy = saveAsMine(r, e.serv); toast(t().savedToast); replaceTop({ s: 'recipe', id: copy.id, serv: copy.servings }); });
    on('delete-mine', () => { mine = mine.filter((y) => y.id !== r.id); saveMine(); toast(t().deletedToast); goBack(); });
    return 'start-cook';
  }

  function startCook(r, e) {
    const bases = r.mine ? [] : homeBases(r);
    const entry = { s: 'cook', id: r.id, serv: e.serv || r.servings, step: 0, bases, method: methodOf(r) };
    Promise.all(bases.map(ensure)).then(() => {
      if (cur() !== e) return;
      go(entry);
      enterStep();
      renderTimerbar();
      updateBigTimer();
      renderFooter();
    }, () => { toast(t().loadError); });
  }

  function saveAsMine(r, serv) {
    serv = serv || r.servings;
    const k = serv / r.servings;
    const m = methodOf(r);
    const steps = r.steps.map((s, i) => { const o = resolveStep(s, m && m !== (r.methods || [])[0] ? m : null, -1, r.id, i, k, r.ingredients); const out = { t: o.t }; if (o.timer) { out.timer = o.timer; out.label = s.label || t().stepN(i + 1); } return out; });
    const copy = {
      id: 'mia-' + slug(r.title) + '-' + Date.now().toString(36),
      title: r.title, servings: serv, minutes: r.minutes,
      ingredients: r.ingredients.map((i) => { const q = i.q == null ? null : Math.round(i.q * k * 10) / 10; return { q, u: i.u, n: ingName(i, q), ...(i.f ? { f: i.f } : {}), ...(i.k ? { k: i.k } : {}), ...(i.make ? { make: i.make } : {}) }; }),
      steps, tips: r.tips || [], kcal: r.kcal, diet: r.diet,
      mine: true, lang: r.lang || lang, basedOn: r.mine ? (r.basedOn || null) : r.id, tags: ['mia']
    };
    mine.unshift(copy);
    saveMine();
    return copy;
  }

  function enterStep() {
    const e = cur();
    const p = planOf(e);
    const s = p && p.steps[e.step];
    if (s && s.timer) startTimer(s.timer, stepLabel(s, s.i), s.key);
  }

  function renderCook() {
    const L = t();
    const e = cur();
    const r = findRecipe(e.id);
    const missing = [e.id].concat(e.bases || []).filter((id) => !findRecipe(id));
    if (missing.length) {
      if (e.err) return showError();
      need(Promise.all(missing.map(ensure)));
      return showLoading();
    }
    const p = planOf(e);
    if (e.step >= p.steps.length) return renderDone(r, e);
    const s = p.steps[e.step];
    const tm = stepTimerOf(e);
    const meth = (r.methods || []).length > 1 && e.method ? `<span class="meth">${icon(IC[e.method] ? e.method : 'pot')}${esc(methodName(e.method))}</span>` : '';
    const phase = p.phases.length ? `<div class="phase"><span class="pn">${s.ph + 1}</span><span>${esc(p.phases[s.ph])}</span></div>` : `<div class="phase plain"><span>${esc(r.title)}</span></div>`;
    const ticks = p.steps.map((x, i) => `<i class="${i === e.step ? 'cur' : i < e.step ? 'on' : ''}${i && x.ph !== p.steps[i - 1].ph ? ' gap' : ''}"></i>`).join('');
    const clock = tm ? (tm.done ? L.done : fmtClock(tm.remaining)) : fmtClock(s.timer || 0);
    const lit = tm ? (tm.done ? 60 : Math.ceil((tm.remaining / tm.total) * 60)) : 60;
    $content.innerHTML = `
      <div class="cook-h"><span>${esc(L.stepOf(e.step + 1, p.steps.length))}</span>${meth}</div>
      ${phase}
      <div class="ticks" aria-hidden="true">${ticks}</div>
      <div class="steptext${s.t.length > 110 ? ' long' : ''}">${esc(s.t)}</div>
      ${s.timer ? `
        <div id="bigtimer" class="big-timer${tm && tm.done ? ' done' : ''}">
          <span class="dw">${dial(60, (i) => (i < lit ? 'on' : ''))}<b class="${clock.length > 5 ? 'hms' : ''}">${clock}</b></span>
          <span class="lbl">${esc(stepLabel(s, s.i))}<small><span>${tm ? (tm.done ? L.timeUp : (tm.paused ? L.paused : L.running)) : L.ready}</span></small></span>
        </div>` : ''}`;
    renderFooter();
    return 'next';
  }

  function renderFooter() {
    const e = cur();
    if (e.s !== 'cook') return;
    const p = planOf(e);
    if (!p || e.step >= p.steps.length) return;
    const L = t();
    const s = p.steps[e.step];
    const tm = stepTimerOf(e);
    const focused = activeId();
    const parts = [];
    if (e.step > 0) parts.push(`<button type="button" id="prev" aria-label="${esc(L.prev)}">◀</button>`);
    if (s.timer) {
      if (!tm) parts.push(`<button type="button" id="timer-start">${esc(L.startTimer)}</button>`);
      else if (tm.done) parts.push(`<button type="button" id="timer-again">${esc(L.oneMore)}</button>`);
      else parts.push(`<button type="button" id="timer-pause">${esc(tm.paused ? L.resume : L.pause)}</button>`);
    }
    const last = e.step === p.steps.length - 1;
    parts.push(`<button type="button" id="next" class="primary">${last ? icon('check') : ''}<span>${esc(last ? L.finish : L.next)}</span>${last ? '' : icon('play')}</button>`);
    $footer.innerHTML = parts.join('');
    on('prev', () => moveStep(-1));
    on('next', () => moveStep(1));
    on('timer-start', () => { enterStep(); renderCook(); refocus('timer-pause'); });
    on('timer-pause', () => { const x = stepTimerOf(cur()); if (x) togglePause(x); renderFooter(); updateBigTimer(); renderTimerbar(); refocus('timer-pause'); });
    on('timer-again', () => { const x = stepTimerOf(cur()); if (x) { removeTimer(x); startTimer(60, x.label, x.stepKey); } renderCook(); renderTimerbar(); refocus('timer-pause'); });
    if (focused && document.getElementById(focused)) refocus(focused);
  }

  // Lasci un passo: il suo timer si chiude, a meno che la cottura vada avanti in sottofondo (bg).
  function moveStep(delta) {
    const e = cur();
    const p = planOf(e);
    if (!p) return;
    const leaving = p.steps[e.step];
    if (leaving) {
      const tm = timers.find((x) => x.stepKey === leaving.key);
      if (tm && (!leaving.bg || tm.done)) removeTimer(tm);
    }
    e.step = Math.min(p.steps.length, Math.max(0, e.step + delta));
    if (delta > 0 && e.step < p.steps.length) enterStep();
    render();
  }

  function renderDone(r, e) {
    const L = t();
    const left = timers.filter((x) => !x.done).length;
    const tips = r.tips || [];
    const order = ['twist', 'pair', 'secret', 'spice', 'leftover'];
    const pick = tips.slice().sort((a, b) => order.indexOf(a.k) - order.indexOf(b.k))[0];
    $content.innerHTML = `
      <div class="done-hero">
        <div class="dw">${dial(60, () => 'on')}${icon('check')}</div>
        <h1>${esc(L.enjoy)}</h1>
        <p class="meta">${esc(r.title)}, ${esc(L.serv(e.serv))}</p>
        ${left ? `<p class="note">${esc(L.left(left))}</p>` : ''}
      </div>
      ${pick ? `<h2>${esc(L.nextTime)}</h2>${tipsBlock({ tips: [pick] }, 'dtip-')}` : ''}
      ${btn('wa-done', esc(L.waSend), esc(L.waRecipe(L.serv(e.serv))), '', 'wa')}
      ${!r.mine ? btn('save-mine', L.saveMine, L.saveAgain, '', 'mine') : ''}`;
    $footer.innerHTML = `<button type="button" id="home" class="primary"><span>${esc(L.toStart)}</span></button>`;
    on('wa-done', () => openWhatsApp(recipeText(r, e)));
    on('home', () => { timers.filter((x) => x.done).forEach(removeTimer); goHome(); });
    on('save-mine', () => { saveAsMine(r, e.serv); toast(t().savedToast); render('home'); });
    if (pick && pick.link && D.byId.has(pick.link)) on('dtip-0', () => openRecipe(pick.link));

  function shopSources(e) {

  // Ritorna una promessa che si risolve quando ricette, basi fatte in casa e shop.json sono pronti.
  function shopLoad(e) {
    const first = e.from === 'menu' ? loadCore().then(loadMenus) : loadCore();
    return first.then(() => Promise.all(shopSources(e).map(ensure))).then((rs) => {
      const bids = [...new Set(rs.filter(Boolean).flatMap((r) => (r.mine ? [] : homeBases(r))))];
      return Promise.all(bids.map(ensure));
    }).then(loadShop);
  }
  function shopReady(e) {
    if (D.shopSt !== 'ok' || D.st !== 'ok') return false;
    if (e.from === 'menu' && D.menusSt !== 'ok') return false;
    return shopSources(e).every((id) => {
      const r = findRecipe(id);
      return r && (r.mine ? true : homeBases(r).every((b) => findRecipe(b)));
    });
  }
  function shopModel(e) {
    const items = new Map();
    const add = (ing, k) => {
      const key = (ing.k || slug(ing.n)) + '|' + (ing.u || '');
      let it = items.get(key);
      if (!it) { it = { key, k: ing.k || slug(ing.n), u: ing.u || '', q: 0, has: false, n: ing.n }; items.set(key, it); }
      if (ing.q == null) return;
      it.q += ing.q * k; it.has = true;
    };
    const n = e.n || 1;
    for (const id of shopSources(e)) {
      const r = findRecipe(id);
      if (!r) continue;
      const serv = n;
      for (const ing of r.ingredients) {
        if (ing.make && !r.mine && isHome(ing.make)) {
          const b = findRecipe(ing.make);
          if (b) { b.ingredients.forEach((y) => add(y, serv / b.servings)); continue; }
        }
        add(ing, serv / r.servings);
      }
    }
    // Un solo rigo per prodotto: stesso nome e unità si sommano; "q.b." sparisce se c'è già una quantità.
    const byName = new Map();
    for (const it of items.values()) {
      const s = D.shop && D.shop[it.k];
      if (s && s.n && s.n[lang]) it.n = s.n[lang];
      const nk = norm(it.n) + '|' + it.u;
      const prev = byName.get(nk);
      if (prev) { prev.q += it.q; prev.has = prev.has || it.has; prev.keys.push(it.key); }
      else { it.keys = [it.key]; byName.set(nk, it); }
    }
    const quant = new Set([...byName.values()].filter((x) => x.has).map((x) => x.k));
    const groups = {}, staples = [];
    for (const it of byName.values()) {
      if (!it.has && quant.has(it.k)) continue;
      if (it.has && (it.u === 'g' || it.u === 'ml') && it.q < 10) it.q = Math.ceil(it.q);
      if (it.has && it.u === '' && it.q > 0) it.q = Math.ceil(it.q - 0.01); // al banco non si compra mezza carota
      it.qt = it.has ? fmtQty(it.q, it.u) : '';
      const se = D.shop && D.shop[it.k];
      if (se ? !!se.pantry : STAPLE.test(it.k)) staples.push(it); // shop.json decide; la regola interna vale solo senza

      else (groups[aisleOf(it.k)] = groups[aisleOf(it.k)] || []).push(it);
    }
    const sortN = (a, b) => a.n.localeCompare(b.n, lang);
    return { groups: AISLES.filter((a) => groups[a]).map((a) => ({ aisle: a, items: groups[a].sort(sortN) })), staples: staples.sort(sortN) };
  }
  const shopKey = (e) => `${e.from}:${e.id}`;
  // Testo da mandare: la ricetta con le porzioni scelte (nomi e quantità già ricalcolati).
  function recipeText(r, e) {
    const L = t(), serv = (e && e.serv) || r.servings, k = serv / r.servings, m = methodOf(r);
    const ing = scaledIng(r, serv).map((i) => `- ${(fmtQty(i.q, i.u) + ' ' + ingName(i, i.q)).trim()}`);
    const steps = r.steps.map((s, i) => `${i + 1}. ${resolveStep(s, m && m !== (r.methods || [])[0] ? m : null, -1, r.id, i, k, r.ingredients).t}`);
    return [`*${r.title}* (${L.serv(serv)})`, '', `*${L.waIng}*`, ...ing, '', `*${L.waSteps}*`, ...steps, '', `${L.waFrom}: https://sousview.vercel.app`].join('\n');
  }
  // Apre WhatsApp col messaggio pronto (wa.me): sul telefono funziona; sugli occhiali dipende dal browser Meta.
  function openWhatsApp(text) {

  function shopText(e) {
    const L = t();

    const title = e.from === 'menu' ? ((menuById(e.id) || {}).i18n || {})[lang] : null;
    const head = `${L.shop}: ${e.from === 'menu' ? (title && title.title) || e.id : (findRecipe(e.id) || {}).title} (${e.from === 'menu' ? L.guests(e.n) : L.serv(e.n)})`;
    const line = (it) => `- ${it.n}${it.qt ? ': ' + it.qt : ''}`;

    model.groups.forEach((g) => parts.push('', L.aisles[g.aisle], ...g.items.map(line)));

  function renderShop() {

    h += model.groups.map((g) => `<h2>${esc(L.aisles[g.aisle])}</h2>${g.items.map(item).join('')}`).join('');

    if (ticks.size) h += `<div style="margin-top:0.8rem">${btn('shop-reset', esc(L.untick), '')}</div>`;
    $content.innerHTML = h;
    $footer.innerHTML = '';
    ids.forEach(([id, it]) => on(id, () => {

  // ---------- Render ----------
  function val(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }
  function refocus(id) { const el = document.getElementById(id); if (el) el.focus({ preventScroll: false }); }
  let lastEntry = null, lastPrimary = null;
  function render(focusId) {
    for (const k in handlers) delete handlers[k];
    ringSig = null;
    const e = cur();
    let primary;
    switch (e.s) {
      case 'cat': primary = renderCat(); break;
      case 'sub': primary = renderSub(); break;
      case 'search': primary = renderSearch(); break;
      case 'filters': primary = renderFilters(); break;
      case 'recipe': primary = renderRecipe(); break;
      case 'cook': primary = renderCook(); break;
      case 'mine': primary = renderMine(); break;
      case 'create': primary = renderCreate(); break;
      case 'company': primary = renderCompany(); break;
      case 'settings': primary = renderSettings(); break;
      case 'menus': primary = renderMenus(); break;
      case 'cuisines': primary = renderCuisines(); break;
      case 'cuisine': primary = renderCuisine(); break;
      case 'menu': primary = renderMenu(); break;
      case 'shop': primary = renderShop(); break;
      default: e.s = 'home'; primary = renderHome();
    }
    if (e !== lastEntry) { $content.scrollTop = 0; lastEntry = e; }
    renderTimerbar();
    drawBack();
    registerTools();

  // ---------- Strumenti per Meta AI (WebMCP) ----------
  let toolsController = null;

  function recipeSummary(r, e) {
    const serv = e && e.serv ? e.serv : r.servings;

    return {
      id: r.id, title: r.title, servings: serv, minutes: r.minutes, kcal_per_serving: r.kcal || null,
      ingredients: scaledIng(r, serv).map((i) => (fmtQty(i.q, i.u) + ' ' + ingName(i, i.q)).trim()),
      steps: r.steps.map((s, i) => { const o = resolveStep(s, meth && meth !== (r.methods || [])[0] ? meth : null, -1, r.id, i, serv / r.servings, r.ingredients); return `${i + 1}. ${o.t}${o.timer ? ` (timer ${Math.round(o.timer / 60)} min${o.bg ? ', keeps running in background' : ''})` : ''}`; }),
      homemade_options: (r.mine ? [] : basesOf(r)).map((b) => ({ base_id: b.id, ingredient: b.ing.n, base_title: (findRecipe(b.id) || {}).title || titleOf(D.byId.get(b.id)), homemade: isHome(b.id) })),
      methods: (r.methods || []).map((m) => ({ id: m, name: methodName(m), selected: m === meth })),
      tips: (r.tips || []).map((tp) => ({ kind: tp.k, text: tp.t, ...(tp.link && D.byId.has(tp.link) ? { linked_recipe_id: tp.link, linked_recipe_title: titleOf(D.byId.get(tp.link)) } : {}) }))
    };
  }
  function findByTitle(q) {
    const id = String(q || '').trim();
    if (!id) return null;
    if (findMine(id)) return id;
    if (D.byId.has(id)) return id;
    const n = norm(id);
    const m = mine.find((r) => norm(r.title) === n) || mine.find((r) => norm(r.title).includes(n));
    if (m) return m.id;
    const ex = D.idx.find((x) => Object.values(x.t).some((ti) => norm(ti) === n));
    if (ex) return ex.id;
    const hit = search(id, { filters: [], anyLang: true })[0];
    return hit ? hit.id : null;
  }
  const catFrom = (c) => {
    if (!c || !D.tree) return null;
    const n = norm(c);
    const k = D.tree.cats.find((x) => x.id === c || Object.values(x.name).some((v) => norm(v) === n));
    return k ? k.id : null;
  };

    const core = () => withTimeout(loadCore(), 8000);

    reg({
      name: 'recipes_search',

        const total = list.length;

    reg({
      name: 'filters_set',

        let r;
        try { r = await withTimeout(ensure(id), 8000); } catch (er) { return { error: 'offline', next_action: 'Say the recipe could not be loaded. Stop.' }; }
        const n = Math.round(Number(input && input.servings));

    });
    reg({
      name: 'recipe_create',
      description: `Creates and saves a new recipe in the user's collection (My recipes), then opens it. Use it when the user asks you to invent a recipe, write one from scratch, or save a changed version of a recipe. Write the title, ingredients and steps in ${NAME_EN[lang]}, the app's current language. Each step must be one short action; write durations like "${t().durEx}" inside a step so the app starts a timer for it.`,
      inputSchema: {
        type: 'object',
        properties: {
          title: { type: 'string', description: 'Short recipe name.' },
          servings: { type: 'number', description: 'Number of servings the quantities are for.' },
          ingredients: { type: 'string', description: 'Ingredients separated by semicolons, each as quantity, unit, name. Units: g, kg, ml, l, tbsp, tsp, or none.' },
          steps: { type: 'string', description: 'Steps separated by semicolons, in order.' },

        if (steps.length > 30 || ings.length > 40) return { error: 'too_long', next_action: 'Shorten the recipe and call recipe_create again.' };
        const bid = input.based_on && String(input.based_on);
        const r = buildRecipe({ title, servings: isRealNumber(input.servings) ? input.servings : 2, ingredients: ings, steps, basedOn: bid && (findMine(bid) || D.byId.has(bid)) ? bid : null });
        mine.unshift(r); saveMine();
        go({ s: 'recipe', id: r.id, serv: r.servings });
        return { saved: r.title, language: NAME_EN[lang], steps: r.steps.length, timers: r.steps.filter((s) => s.timer).length, next_action: `Say the recipe is saved and on screen, in one short sentence in ${NAME_EN[lang]}. Stop.` };

    reg({
      name: 'cuisine_open',
      description: 'Shows the recipes of one national cuisine (Italian, Indian, Moroccan, Japanese, Thai...), grouped by course, optionally only meat, poultry, fish, vegetarian or vegan dishes. Without a cuisine it opens the list of all cuisines with their recipe counts.',

      name: 'whatsapp_call',
      description: 'For cooking together: the user wants to video call or call someone on WhatsApp while cooking. The recipe stays open at the current step.',
      inputSchema: { type: 'object', properties: { contact: { type: 'string', description: 'Name of the WhatsApp contact, as the user said it.' }, video: { type: 'string', enum: ['yes', 'no'], description: 'Video call (yes, default) or voice call (no).' } }, required: ['contact'] },
      async execute(input) {
        const who = input && typeof input.contact === 'string' ? input.contact.trim().slice(0, 60) : '';
        if (!who) return { error: 'no_contact', next_action: 'Ask who to call.' };
        const c = cur(), r = c.id && findRecipe(c.id);
        const where = c.s === 'cook' && r ? `${r.title}, step ${c.step + 1}` : r ? r.title : '';
        return { contact: who, cooking: where || null, next_action: `Start a WhatsApp ${input.video === 'no' ? 'voice' : 'video'} call with ${who} now. SousView stays open${where ? ' on ' + where : ''}.` };
      }
    });

    if (e.s === 'home' || e.s === 'settings') {
      reg({
        name: 'language_set',
        description: 'Changes the language of the app on the glasses: menus, recipes, timers and voice alerts. Supported: Italian, English, French, Spanish, German. Recipes the user saved stay in the language they were written in.',
        inputSchema: { type: 'object', properties: { language: { type: 'string', enum: ['it', 'en', 'fr', 'es', 'de'], description: 'Language code.' } }, required: ['language'] },
        async execute(input) {
          const k = input && input.language;
          if (!T[k]) return { error: 'unsupported_language', supported: LANGS.map(([c]) => c), next_action: 'Say which languages are available. Stop.' };
          setLang(k);
          return { language: k, next_action: 'Confirm in one short sentence. Stop.' };
        }
      });
    }

    if (e.s === 'recipe' || e.s === 'cook') {
      const r = findRecipe(e.id);
      if (r) {
        reg({
          name: 'recipe_current',
          description: 'Returns the recipe on screen: ingredients for the chosen servings, all steps for the chosen cooking method, homemade-or-store-bought options, cooking methods and tips. Use it before suggesting changes or a variant.',
          annotations: { readOnlyHint: true },
          async execute() { return { ...recipeSummary(r, e), current_step: e.s === 'cook' ? e.step + 1 : null, next_action: 'Answer the user briefly; to save a changed version call recipe_create with based_on.' }; }
        });
        reg({
          name: 'servings_set',
          description: 'Changes how many servings the recipe on screen is for. Quantities are recalculated by the app.',
          inputSchema: { type: 'object', properties: { servings: { type: 'number', description: 'Whole number from 1 to 20.' } }, required: ['servings'] },
          async execute(input) {
            const n = Math.round(Number(input && input.servings));
            if (!isFinite(n) || n < 1 || n > 20) return { error: 'out_of_range', next_action: 'Ask for a number between 1 and 20.' };
            e.serv = n; render(activeId());
            return { servings: n, next_action: 'Confirm in one short sentence. Stop.' };
          }
        });
      }
      if (r && e.s === 'recipe') {
        reg({
          name: 'homemade_set',
          description: 'Chooses store-bought or homemade for an ingredient that can be made at home (fresh pasta, pizza dough, broth, sauces…). Homemade adds that base recipe\'s steps before the dish when cooking. See homemade_options in recipe_current.',
          inputSchema: { type: 'object', properties: { base: { type: 'string', description: 'base_id from recipe_current, the ingredient name, or "all".' }, homemade: { type: 'boolean' } }, required: ['base', 'homemade'] },
          async execute(input) {
            const bs = basesOf(r);
            if (!bs.length) return { error: 'no_options', next_action: 'Say this recipe has nothing to make at home. Stop.' };
            const q = String((input && input.base) || '');
            const pick = q === 'all' ? bs : bs.filter((b) => b.id === q || norm(b.ing.n).includes(norm(q)) || norm(q).includes(norm(b.ing.n)));
            if (!pick.length) return { error: 'not_found', options: bs.map((b) => b.id), next_action: 'Call homemade_set with one of the options.' };
            pick.forEach((b) => setHome(b.id, !!(input && input.homemade)));
            try { await withTimeout(Promise.all(pick.map((b) => ensure(b.id))), 8000); } catch (er) { /* si vedrà il caricamento */ }
            render(activeId());
            return { changed: pick.map((b) => b.id), homemade: !!input.homemade, next_action: 'Confirm in one short sentence. Stop.' };
          }
        });
        if ((r.methods || []).length > 1) {
          reg({
            name: 'method_set',
            description: 'Chooses the cooking method for the recipe on screen (for example oven or air fryer). Steps and timers adapt.',
            inputSchema: { type: 'object', properties: { method: { type: 'string', enum: r.methods, description: 'Method id.' } }, required: ['method'] },
            async execute(input) {
              const m = String((input && input.method) || '');
              const id = r.methods.find((x) => x === m || norm(methodName(x)) === norm(m));
              if (!id) return { error: 'not_available', options: r.methods, next_action: 'Offer the available methods. Stop.' };
              setMethod(r, id); render(activeId());
              return { method: id, name: methodName(id), next_action: 'Confirm in one short sentence. Stop.' };
            }
          });
        }
      }
    }

    if (e.s === 'cook') {
      reg({
        name: 'step_next',
        description: 'Moves to the next cooking step. If that step has a timer, the app starts it.',
        async execute() {
          const p = planOf(cur());
          if (!p) return { error: 'not_cooking' };
          moveStep(1);
          const c = cur();
          if (c.step >= p.steps.length) return { finished: true, next_action: 'Say the recipe is done. Stop.' };
          const s = p.steps[c.step];
          return { step: c.step + 1, of: p.steps.length, timer_started_minutes: s.timer ? Math.round(s.timer / 60) : null, next_action: 'Do not read the step aloud; the user sees it. Say nothing or one short word. Stop.' };
        }
      });
      reg({
        name: 'step_previous',
        description: 'Goes back to the previous cooking step.',
        async execute() {
          const c = cur();
          if (c.step === 0) return { error: 'first_step', next_action: 'Say this is already the first step. Stop.' };
          moveStep(-1);
          return { step: cur().step + 1, next_action: 'Stop.' };
        }
      });
      reg({
        name: 'timer_start',
        description: 'Starts an extra kitchen timer shown at the top of the display, for example for something not in the recipe.',
        inputSchema: { type: 'object', properties: { minutes: { type: 'number', description: 'Duration in minutes, 1 to 240.' }, label: { type: 'string', description: 'Short name for what is cooking.' } }, required: ['minutes'] },
        async execute(input) {
          const m = Number(input && input.minutes);
          if (!isFinite(m) || m < 0.25 || m > 240) return { error: 'out_of_range', next_action: 'Ask for a duration between 1 and 240 minutes.' };
          const label = String((input && input.label) || '').trim().slice(0, 20);
          const tm = startTimer(Math.round(m * 60), label || null);
          return { started: timerLabel(tm), minutes: m, running_timers: timers.filter((x) => !x.done).length, next_action: 'Confirm in one short sentence. Stop.' };
        }
      });
      reg({
        name: 'timer_status',
        description: 'Tells how much time is left on each running kitchen timer.',
        annotations: { readOnlyHint: true },
        async execute() {
          return { timers: timers.map((x) => ({ label: timerLabel(x), left: x.done ? 'done' : fmtClock(x.remaining), paused: x.paused })), next_action: 'Answer in one short sentence. Stop.' };
        }
      });
    }
  }

  // ---------- Avvio ----------
  document.documentElement.lang = lang;
  loadCore().catch(() => {});
  loadMenus();
  render();
  if (navigator.wakeLock && navigator.wakeLock.request) {
    navigator.wakeLock.request('screen').catch(() => {});
  }
})();
</script>
</body>
</html>
