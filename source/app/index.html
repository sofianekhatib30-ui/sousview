<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="FixView: riparazioni e fai-da-te passo passo sugli occhiali, a mani libere. Timer, controlli a metà lavoro e regole di sicurezza per il tuo paese.">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>FixView</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;800&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
  * { box-sizing: border-box; }
  :root {
    /* Display additivo: il nero è trasparente, ogni colore è luce sopra il banco di lavoro. */
    --ink: #F2F4F0;
    --quiet: #9DA6AB;
    --tape: #FFD23F;      /* metro giallo: marchio, focus, avanzamento */
    --blue: #5CC8FF;      /* blueprint: attrezzi, controlli, informazioni */
    --hazard: #FF6B4A;    /* avvisi e rischio */
    --line: rgba(242, 244, 240, 0.24);
    --surface: rgba(242, 244, 240, 0.055);
    --dim: rgba(242, 244, 240, 0.2);
    --cond: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
    --sans: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: clamp(15px, 4.1vmin, 30px);
    color-scheme: dark;
  }
  html, body, #app { inline-size: 100%; block-size: 100%; }
  body { margin: 0; overflow: hidden; background: #000; color: var(--ink); font-family: var(--sans); line-height: 1.3; -webkit-font-smoothing: antialiased; }
  .shell { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-areas: 'h' 'r' 'c' 'f'; inline-size: 100%; block-size: 100%; padding: 4vmin 5vmin; overflow: hidden; }
  header { grid-area: h; display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; min-block-size: 1.35rem; margin-block-end: 2vmin; min-inline-size: 0; }
  .hl { display: flex; align-items: center; gap: 0.5rem; min-inline-size: 0; }
  button.back { inline-size: auto; min-block-size: 1.9rem; margin: 0; padding: 0.2rem 0.65rem 0.2rem 0.4rem; gap: 0.25rem; border-radius: 2rem; font-size: 0.74rem; flex: none; }
  button.back svg { inline-size: 1rem; block-size: 1rem; flex: none; }
  button.back[hidden] { display: none; }
  .timing .back span { display: none; }
  .brand { display: flex; align-items: center; gap: 0.3rem; flex: none; font-family: var(--cond); font-weight: 800; font-size: 1rem; color: var(--tape); white-space: nowrap; letter-spacing: 0.01em; }
  .brand svg { inline-size: 1.35rem; block-size: 0.7rem; }
  .timing .brand-word { display: none; }
  .timers { display: flex; gap: 0.35rem; flex-wrap: wrap; justify-content: flex-end; min-inline-size: 0; }
  .timer { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.1rem 0.55rem; border-radius: 2rem; border: 2px solid var(--blue); color: var(--blue); font-size: 0.7rem; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; max-inline-size: 100%; overflow: hidden; text-overflow: ellipsis; }
  .timer.cur { background: var(--blue); color: #000; }
  .timer.paused { border-style: dashed; }
  .timer.cur.paused { background: transparent; color: var(--blue); }
  .timer.done { background: var(--tape); border-color: var(--tape); color: #000; animation: blink 0.8s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }
  #ring { grid-area: r; display: grid; gap: 0.35rem; margin-block-end: 2vmin; }
  #ring:empty { display: none; }
  #ring button { margin: 0; background: var(--tape); border-color: var(--tape); color: #000; animation: blink 0.8s steps(2) infinite; }
  #ring button * { color: #000; stroke: #000; }
  #ring button:focus { animation: none; }
  .content { grid-area: c; min-block-size: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding: 7px 8px; margin: -7px -8px; }
  .content::-webkit-scrollbar { display: none; }
  footer { grid-area: f; display: flex; gap: 0.55rem; margin-block-start: 2vmin; }
  footer:empty { display: none; }
  footer button { inline-size: auto; flex: 1 1 auto; justify-content: center; text-align: center; margin: 0; }
  footer button.sq { flex: 0 0 3.2rem; padding-inline: 0; }

  h1 { font-family: var(--cond); font-weight: 800; font-size: 1.62rem; line-height: 1; letter-spacing: 0.005em; margin: 0.05rem 0 0.4rem; overflow-wrap: break-word; hyphens: auto; }
  h1.hero { font-size: 2.05rem; margin-block-end: 0.5rem; }
  h1 .ic { inline-size: 1.35rem; block-size: 1.35rem; color: var(--tape); vertical-align: -0.12em; margin-inline-end: 0.35rem; }
  h2 { display: flex; align-items: center; gap: 0.45rem; font-size: 0.78rem; font-weight: 800; color: var(--quiet); margin: 1rem 0 0.45rem; }
  h2 .n { color: var(--blue); font-variant-numeric: tabular-nums; }
  p { margin: 0 0 0.5rem; }
  .intro { font-size: 0.86rem; margin-block-end: 0.6rem; }
  .meta { color: var(--quiet); font-size: 0.74rem; }
  .ic { inline-size: 1.2rem; block-size: 1.2rem; flex: none; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }

  button, input { font: inherit; color: inherit; }
  button { display: flex; align-items: center; gap: 0.6rem; inline-size: 100%; min-block-size: 2.3rem; text-align: start; padding: 0.5rem 0.8rem; border-radius: 0.7rem; border: 2px solid var(--line); background: var(--surface); font-size: 0.88rem; font-weight: 700; cursor: pointer; margin: 0 0 0.45rem; -webkit-tap-highlight-color: transparent; }
  button .grow { flex: 1; min-inline-size: 0; overflow-wrap: break-word; }
  button .sub { display: block; font-weight: 400; font-size: 0.68rem; color: var(--quiet); margin-block-start: 0.05rem; }
  button > .ic { color: var(--tape); }
  button.primary { border: 3px solid var(--tape); color: var(--tape); justify-content: center; }
  button.primary .ic { inline-size: 1rem; block-size: 1rem; }
  button.danger { border-color: var(--hazard); color: var(--hazard); }
  button.danger > .ic { color: var(--hazard); }
  /* Focus: una striscia di metro giallo con il testo ritagliato in nero. */
  button:focus { outline: 3px solid var(--ink); outline-offset: 3px; background: var(--tape); border-color: var(--tape); color: #000; }
  button:focus * { color: #000 !important; }
  button:focus .ic { stroke: #000; }
  input { inline-size: 100%; background: var(--surface); border: 2px solid var(--line); border-radius: 0.7rem; padding: 0.5rem 0.75rem; font-size: 0.86rem; min-block-size: 2.3rem; }
  input:focus { outline: 3px solid var(--tape); outline-offset: 2px; border-color: var(--tape); }
  input[type=search]::-webkit-search-cancel-button { display: none; }
  label { display: block; font-size: 0.74rem; color: var(--quiet); margin: 0.55rem 0 0.25rem; }
  .search { position: relative; margin: 0 0 0.5rem; }
  .search .ic { position: absolute; inset-inline-start: 0.75rem; inset-block-start: 50%; transform: translateY(-50%); color: var(--quiet); pointer-events: none; }
  .search input { padding-inline-start: 2.35rem; }

  /* La firma: il metro. Ogni passo è un centimetro con la sua tacca. */
  .tape { position: relative; display: flex; block-size: 1.25rem; margin: 0.35rem 0 0.75rem; border-radius: 0.2rem; overflow: hidden; }
  .tape i { position: relative; flex: 1; border-inline-end: 2px solid #000; background: rgba(255, 210, 63, 0.22); }
  .tape i::after { content: ''; position: absolute; inset-inline-start: 50%; inset-block-start: 0; block-size: 35%; inline-size: 2px; background: rgba(0, 0, 0, 0.5); }
  .tape i.on { background: var(--tape); }
  .tape i.cur { background: var(--tape); }
  .tape i b { position: absolute; inset-inline-start: 0.2rem; inset-block-end: 0.02rem; font-size: 0.58rem; font-weight: 800; color: #000; font-variant-numeric: tabular-nums; line-height: 1; }
  .tape i:not(.on):not(.cur) b { color: var(--tape); }
  .tape i.cur::before { content: ''; position: absolute; inset-inline-end: -2px; inset-block: 0; inline-size: 4px; background: var(--hazard); z-index: 1; }
  .tape.mini { block-size: 0.5rem; margin: 0.25rem 0 0; }
  .tape.mini i b, .tape.mini i::after { display: none; }

  .cats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.45rem; }
  .cats button { margin: 0; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 0.3rem; min-block-size: 4.2rem; padding: 0.5rem 0.55rem; position: relative; }
  .cats .ic { inline-size: 1.45rem; block-size: 1.45rem; color: var(--tape); }
  .cats .nm { font-size: 0.7rem; line-height: 1.12; hyphens: auto; overflow-wrap: anywhere; }
  .cats .ct { position: absolute; inset-block-start: 0.45rem; inset-inline-end: 0.55rem; font-size: 0.64rem; font-weight: 800; color: var(--blue); font-variant-numeric: tabular-nums; }

  .grow .tt { display: block; font-size: 0.88rem; line-height: 1.18; }
  .rm { display: flex; flex-wrap: wrap; align-items: center; gap: 0.12rem 0.55rem; font-size: 0.66rem; color: var(--quiet); font-weight: 600; margin-block-start: 0.12rem; }
  .rm .rk { color: var(--hazard); font-weight: 800; }
  .rm .pr { color: var(--hazard); font-weight: 800; }
  .pips { display: inline-flex; gap: 0.16rem; align-items: center; }
  .pips i { inline-size: 0.42rem; block-size: 0.42rem; border-radius: 1px; border: 2px solid var(--tape); }
  .pips i.on { background: var(--tape); }
  button:focus .pips i { border-color: #000; }
  button:focus .pips i.on { background: #000; }
  .row-ic { inline-size: 2.1rem; block-size: 2.1rem; flex: none; display: grid; place-items: center; border-radius: 0.5rem; border: 2px solid var(--dim); }
  .row-ic .ic { inline-size: 1.25rem; block-size: 1.25rem; color: var(--tape); }
  button:focus .row-ic { border-color: #000; }
  button.emg { border-color: var(--hazard); }
  button.emg .row-ic { border-color: var(--hazard); }
  button.emg .row-ic .ic { color: var(--hazard); }
  .emg-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.4rem; }
  .emg-grid button { margin: 0; padding: 0.42rem 0.55rem; gap: 0.45rem; min-block-size: 2.6rem; font-size: 0.74rem; line-height: 1.15; }
  .emg-grid .row-ic { inline-size: 1.6rem; block-size: 1.6rem; border-radius: 0.4rem; }
  .emg-grid .row-ic .ic { inline-size: 1rem; block-size: 1rem; }

  .facts { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0.5rem 1.1rem; margin: 0.1rem 0 0.55rem; }
  .fact { font-size: 0.86rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .fact small { display: block; font-size: 0.62rem; color: var(--quiet); font-weight: 600; }
  .badges { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.1rem 0 0.55rem; }
  .badge { display: inline-flex; align-items: center; gap: 0.25rem; font-size: 0.66rem; font-weight: 800; color: var(--blue); border: 1.5px solid var(--blue); border-radius: 2rem; padding: 0.08rem 0.5rem 0.08rem 0.35rem; }
  .badge .ic { inline-size: 0.9rem; block-size: 0.9rem; }
  .badge.risk { color: var(--hazard); border-color: var(--hazard); }
  .badge.r0 { color: var(--quiet); border-color: var(--dim); }
  .note { border-inline-start: 3px solid var(--blue); padding: 0.25rem 0 0.25rem 0.7rem; font-size: 0.78rem; margin: 0.5rem 0 0.6rem; }
  .note.hz { border-color: var(--hazard); }
  .note b { display: block; font-size: 0.68rem; color: var(--blue); margin-block-end: 0.1rem; }
  .note.hz b { color: var(--hazard); }
  .term { display: inline-block; margin-block-start: 0.25rem; font-weight: 800; color: var(--tape); }

  .item { gap: 0.55rem; padding-block: 0.35rem; min-block-size: 2.05rem; }
  .item .nm { flex: 1; min-inline-size: 0; font-weight: 600; font-size: 0.84rem; overflow-wrap: break-word; }
  .item .qt { flex: none; color: var(--blue); font-weight: 800; font-size: 0.78rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .item[aria-pressed=true] .nm { text-decoration: line-through; color: var(--quiet); }
  .box { inline-size: 1.15rem; block-size: 1.15rem; border: 2px solid var(--quiet); border-radius: 0.3rem; flex: none; display: grid; place-items: center; }
  .box .ic { inline-size: 0.85rem; block-size: 0.85rem; opacity: 0; stroke-width: 3.2; }
  [aria-pressed=true] > .box { background: var(--blue); border-color: var(--blue); }
  [aria-pressed=true] > .box .ic { opacity: 1; stroke: #000; }
  button:focus > .box { border-color: #000; }
  button:focus[aria-pressed=true] > .box { background: #000; }
  button:focus[aria-pressed=true] > .box .ic { stroke: var(--tape); }
  .gate-item[aria-pressed=false] { border-color: var(--hazard); }

  .work-h { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; font-size: 0.72rem; font-weight: 800; color: var(--quiet); }
  .work-h .gt { color: var(--tape); min-inline-size: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--cond); font-size: 0.86rem; }
  .step { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.75rem; align-items: start; }
  .pict { inline-size: 3.2rem; block-size: 3.2rem; display: grid; place-items: center; border: 2.5px solid var(--tape); border-radius: 0.75rem; }
  .pict .ic { inline-size: 2.1rem; block-size: 2.1rem; color: var(--tape); stroke-width: 1.9; }
  .steptext { font-size: 1.24rem; line-height: 1.28; font-weight: 600; }
  .steptext.long { font-size: 1.1rem; }
  .tight .steptext { font-size: 1.06rem; }
  .tight .steptext.long { font-size: 0.98rem; }
  .tight .pict { inline-size: 2.5rem; block-size: 2.5rem; }
  .tight .pict .ic { inline-size: 1.6rem; block-size: 1.6rem; }
  .tight .alert, .tight .ask, .tight .fix { margin-block-start: 0.5rem; }
  .tight .tape { margin-block-end: 0.5rem; }
  .tighter .steptext, .tighter .steptext.long { font-size: 0.94rem; }
  .tighter .alert, .tighter .fix { font-size: 0.74rem; padding-block: 0.3rem; }
  .tighter .ask { font-size: 0.82rem; padding-block: 0.35rem; }
  .tighter .clock { font-size: 1.9rem; }
  .fixing .steptext { font-size: 0.92rem; color: var(--quiet); }
  .tighter .fixing .steptext { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tighter .fixing + .ask { margin-block-start: 0.35rem; }
  .fixing .pict { inline-size: 2.2rem; block-size: 2.2rem; }
  .fixing .pict .ic { inline-size: 1.4rem; block-size: 1.4rem; }
  .mz { color: var(--tape); font-weight: 800; white-space: nowrap; }
  .alert { display: flex; gap: 0.55rem; align-items: flex-start; margin-block-start: 0.75rem; padding: 0.45rem 0.65rem; border: 2px solid var(--hazard); border-radius: 0.7rem; color: var(--hazard); font-size: 0.82rem; font-weight: 700; }
  .alert .ic { inline-size: 1.15rem; block-size: 1.15rem; margin-block-start: 0.05rem; }
  .alert.l1 { border-style: dashed; }
  .ask { margin-block-start: 0.8rem; padding: 0.5rem 0.7rem; border: 2px solid var(--blue); border-radius: 0.7rem; color: var(--blue); font-size: 0.92rem; font-weight: 800; display: flex; gap: 0.5rem; align-items: center; }
  .ask .ic { inline-size: 1.3rem; block-size: 1.3rem; }
  .fix { margin-block-start: 0.6rem; font-size: 0.86rem; border-inline-start: 3px solid var(--blue); padding-inline-start: 0.65rem; }
  .big-timer { display: flex; align-items: center; gap: 0.85rem; margin-block-start: 0.8rem; }
  .clock { font-family: var(--cond); font-weight: 800; font-size: 2.5rem; line-height: 1; color: var(--blue); font-variant-numeric: tabular-nums; min-inline-size: 4.2ch; }
  .big-timer.done .clock { color: var(--tape); animation: blink 0.8s steps(2) infinite; }
  .big-timer .lbl { font-size: 0.82rem; font-weight: 800; }
  .big-timer .lbl small { display: block; color: var(--quiet); font-weight: 600; font-size: 0.7rem; margin-block-start: 0.1rem; }
  .bar { block-size: 0.35rem; border-radius: 1rem; background: var(--dim); overflow: hidden; margin-block-start: 0.3rem; inline-size: 9rem; }
  .bar i { display: block; block-size: 100%; background: var(--blue); }

  .tip { padding: 0.45rem 0.7rem; border-inline-start: 3px solid var(--tape); background: var(--surface); border-radius: 0 0.7rem 0.7rem 0; font-size: 0.8rem; margin: 0 0 0.45rem; font-weight: 600; }
  .done-hero { text-align: center; padding-block-start: 0.6rem; }
  .done-hero .ic { inline-size: 3rem; block-size: 3rem; color: var(--tape); stroke-width: 2.4; }
  ol.plain { margin: 0; padding-inline-start: 1.2rem; }
  ol.plain li { font-size: 0.82rem; margin-block-end: 0.45rem; padding-inline-start: 0.2rem; }
  ol.plain li::marker { color: var(--tape); font-weight: 800; }

  .opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.4rem; margin-block-end: 0.3rem; }
  .opts.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .opts button { margin: 0; justify-content: center; text-align: center; font-size: 0.74rem; padding: 0.35rem 0.4rem; min-block-size: 2.1rem; }
  .opts button[aria-pressed=true] { border-color: var(--blue); color: var(--blue); background: rgba(92, 200, 255, 0.1); }
  .opts button[aria-pressed=true]:focus { background: var(--tape); border-color: var(--tape); color: #000; }
  .result { border: 2px solid var(--blue); border-radius: 0.8rem; padding: 0.55rem 0.75rem; margin: 0.6rem 0 0.4rem; }
  .result .big { font-family: var(--cond); font-weight: 800; font-size: 1.4rem; line-height: 1.05; color: var(--blue); }
  .result p { font-size: 0.78rem; margin: 0.3rem 0 0; }
  .conv { display: grid; gap: 0.3rem; margin-block-start: 0.4rem; }
  .conv div { display: flex; justify-content: space-between; gap: 0.6rem; font-size: 0.86rem; padding: 0.3rem 0; border-block-end: 1px solid rgba(242, 244, 240, 0.1); }
  .conv b { color: var(--blue); font-variant-numeric: tabular-nums; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }

  .state { display: grid; justify-items: center; text-align: center; gap: 0.6rem; padding: 1.2rem 0.4rem; color: var(--quiet); font-size: 0.82rem; }
  .state button { inline-size: auto; padding-inline: 1.4rem; justify-content: center; }
  .loading-tape { inline-size: 6rem; block-size: 0.5rem; border-radius: 1rem; background: var(--dim); overflow: hidden; }
  .loading-tape i { display: block; inline-size: 40%; block-size: 100%; background: var(--tape); animation: slide 1.2s ease-in-out infinite alternate; }
  @keyframes slide { to { transform: translateX(150%); } }
  .empty { color: var(--quiet); font-size: 0.82rem; margin: 0.5rem 0 0.7rem; }
  .hint { font-size: 0.72rem; color: var(--quiet); margin: 0.5rem 0; }

  .langs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.45rem; margin-block-end: 0.6rem; }
  .langs button { margin: 0; padding: 0.5rem 0.6rem; font-size: 0.8rem; }
  .langs button.on { border-color: var(--blue); color: var(--blue); }
  .langs button.on::after { content: ''; flex: none; margin-inline-start: auto; inline-size: 0.45rem; block-size: 0.45rem; border-radius: 50%; background: var(--blue); }
  .langs button.on:focus { color: #000; }
  .langs button.on:focus::after { background: #000; }

  .toast { position: fixed; inset-inline: 6vmin; inset-block-end: 6vmin; background: #000; border: 2px solid var(--tape); padding: 0.5rem 0.8rem; border-radius: 0.7rem; font-size: 0.8rem; font-weight: 700; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .sr { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app" class="shell" aria-live="polite">
  <header>
    <span class="hl"><button type="button" id="hb-back" class="back" hidden></button><span class="brand" id="brand"></span></span>
    <span id="timerbar" class="timers"></span>
  </header>
  <div id="ring"></div>
  <main id="content" class="content"></main>
  <footer id="footer"></footer>
</div>
<div id="toast" class="toast" role="status"></div>

<script>
(() => {
  'use strict';

  // ---------- Lingue ----------
  const LANGS = [['it', 'Italiano'], ['en', 'English'], ['fr', 'Français'], ['es', 'Español'], ['de', 'Deutsch']];
  const VOICE = { it: 'it-IT', en: 'en-GB', fr: 'fr-FR', es: 'es-ES', de: 'de-DE' };
  const NAME_EN = { it: 'Italian', en: 'English', fr: 'French', es: 'Spanish', de: 'German' };
  const COUNTRIES = ['IT', 'UK', 'FR', 'ES', 'DE', 'US'];
  const EMERGENCY = { IT: '112', UK: '999', FR: '112', ES: '112', DE: '112', US: '911' };
  const pl = (n, one, many) => n === 1 ? one : many;

  const T = {

  const icon = (k, cls) => `<svg class="ic${cls ? ' ' + cls : ''}" viewBox="0 0 24 24" aria-hidden="true">${P[k] || P.wrench}</svg>`;
  const tapeLogo = '<svg viewBox="0 0 40 20" aria-hidden="true"><rect x="1" y="2" width="38" height="16" rx="2" fill="#FFD23F"/><path d="M8 2v6M16 2v9M24 2v6M32 2v9" stroke="#000" stroke-width="2"/></svg>';

  // ---------- Dati ----------
  const D = { st: 'idle', idx: [], tree: null, byId: new Map(), cats: {} }; // cats: lang|cat -> Promise/array
  function fetchJSON(url, ms) {
    const ctl = typeof AbortController === 'function' ? new AbortController() : null;
    const tm = setTimeout(() => ctl && ctl.abort(), ms || 12000);
    return fetch(url, ctl ? { signal: ctl.signal } : {}).then((r) => { clearTimeout(tm); if (!r.ok) throw new Error(r.status); return r.json(); }, (e) => { clearTimeout(tm); throw e; });
  }
  let coreP = null;
  function loadCore() {
    if (D.st === 'ok') return Promise.resolve();
    if (coreP) return coreP;
    D.st = 'loading';
    coreP = Promise.all([fetchJSON('data/index.json'), fetchJSON('data/tree.json')]).then(([idx, tree]) => {
      D.idx = idx; D.tree = tree; D.byId = new Map(idx.map((x) => [x.id, x])); D.st = 'ok';
    }, (e) => { D.st = 'error'; coreP = null; throw e; });
    return coreP;
  }
  const catKey = (c, L) => (L || lang) + '|' + c;
  function loadCat(c, L) {
    const k = catKey(c, L);
    if (Array.isArray(D.cats[k])) return Promise.resolve(D.cats[k]);
    if (D.cats[k]) return D.cats[k];
    D.cats[k] = fetchJSON(`data/${L || lang}/${c}.json`).then((list) => (D.cats[k] = list), (e) => { delete D.cats[k]; throw e; });
    return D.cats[k];
  }
  const guide = (id) => {
    const x = D.byId.get(id);
    const list = x && D.cats[catKey(x.c)];
    return Array.isArray(list) ? list.find((g) => g.id === id) || null : null;
  };
  const ensure = (id) => loadCore().then(() => { const x = D.byId.get(id); if (!x) throw new Error('unknown'); return loadCat(x.c); }).then(() => guide(id));
  const catOf = (id) => D.tree && D.tree.cats.find((c) => c.id === id);
  const catName = (c) => (c ? c.name[lang] || c.name.en : '');
  const titleOf = (x) => x.t[lang] || x.t.en;
  const permission = (x) => (x.al && x.al[country]) || 'ok';
  function search(q) {
    const words = norm(q).split(' ').filter((w) => w.length > 1);
    if (!words.length) return [];
    return D.idx.map((x) => {
      const mine = norm(x.t[lang] + ' ' + x.i[lang]);
      const any = norm(Object.values(x.t).join(' ') + ' ' + catName(catOf(x.c)));
      let s = 0;
      for (const w of words) {
        if (norm(x.t[lang]).split(' ').some((p) => p.startsWith(w))) s += 4;
        else if (mine.includes(w)) s += 2;
        else if (any.includes(w)) s += 1;
        else return null;
      }
      return { x, s };
    }).filter(Boolean).sort((a, b) => b.s - a.s).map((r) => r.x);
  }

  // ---------- Navigazione ----------
  const SCREENS = ['home', 'cat', 'search', 'guide', 'gate', 'work', 'pro', 'tools', 'conv', 'plugs', 'paint', 'quick', 'settings', 'emerg'];
  let stack = [{ s: 'home' }];
  let pushed = false, expectPop = false;
  const cur = () => stack[stack.length - 1];
  const activeId = () => (document.activeElement && document.activeElement !== document.body ? document.activeElement.id : '') || '';
  function go(entry, focusId) { cur().f = activeId() || cur().f; stack.push(entry); if (!pushed) { history.pushState({ fv: 1 }, ''); pushed = true; } render(focusId); }
  function replaceTop(entry, focusId) { stack[stack.length - 1] = entry; render(focusId); }
  function goBack() { if (stack.length > 1) history.back(); }
  function goHome() { stack = [stack[0]]; if (pushed) { pushed = false; expectPop = true; history.back(); } render(); }

    render(cur().f);

    if (hs && hs.fv === 1) {

  })();

  // ---------- Timer ----------
  const timers = [];
  let timerSeq = 0;
  const $app = document.getElementById('app'), $content = document.getElementById('content'), $footer = document.getElementById('footer');
  const $timerbar = document.getElementById('timerbar'), $ring = document.getElementById('ring');
  document.getElementById('brand').innerHTML = tapeLogo + '<span class="brand-word">FixView</span>';
  function startTimer(sec, label, key) {
    const ex = key && timers.find((x) => x.key === key);
    if (ex) return ex;
    const tm = { id: ++timerSeq, label: label || t().timer, total: sec, endsAt: Date.now() + sec * 1000, remaining: sec, paused: false, done: false, key: key || null };
    timers.push(tm); renderTimerbar(); return tm;
  }
  function togglePause(tm) {
    if (tm.done) return;
    if (tm.paused) { tm.endsAt = Date.now() + tm.remaining * 1000; tm.paused = false; } else { tm.remaining = Math.max(0, (tm.endsAt - Date.now()) / 1000); tm.paused = true; }
  }
  function removeTimer(tm) { const i = timers.indexOf(tm); if (i >= 0) timers.splice(i, 1); renderTimerbar(); }
  const stepKey = (id, i) => id + '#' + i;
  const currentKey = () => { const e = cur(); return e.s === 'work' ? stepKey(e.id, e.step) : null; };
  function tick() {
    const now = Date.now();
    for (const tm of timers) {
      if (tm.paused || tm.done) continue;
      tm.remaining = Math.max(0, (tm.endsAt - now) / 1000);
      if (tm.remaining <= 0) { tm.done = true; const msg = tm.label + ': ' + t().timeUpMsg; toast(msg); speak(msg); if (cur().s === 'work') renderFooter(); }
    }
    renderTimerbar(); updateBigTimer();
  }
  function renderTimerbar() {
    const ck = currentKey();
    const list = timers.filter((x) => !x.done || x.key === ck).sort((a, b) => (b.key === ck) - (a.key === ck));
    $timerbar.innerHTML = list.map((tm) => `<span class="timer${tm.key === ck ? ' cur' : ''}${tm.done ? ' done' : ''}${tm.paused ? ' paused' : ''}">${esc(tm.label)} ${tm.done ? t().doneShort : fmtClock(tm.remaining)}</span>`).join('');
    $app.classList.toggle('timing', list.length >= 2);
    renderRing();
  }
  let ringSig = null;
  function renderRing() {
    const ck = currentKey();
    const ring = timers.filter((x) => x.done && x.key !== ck);
    const sig = lang + ring.map((x) => x.id).join(',');
    if (sig === ringSig) return;
    ringSig = sig;
    $ring.innerHTML = ring.map((tm) => `<button type="button" id="ring-${tm.id}">${icon('clock')}<span class="grow">${esc(tm.label)}: ${esc(t().timeUpMsg)}<span class="sub">${esc(t().dismiss)}</span></span></button>`).join('');
    ring.forEach((tm) => on('ring-' + tm.id, () => { const had = activeId() === 'ring-' + tm.id; removeTimer(tm); if (had) { const f = $footer.querySelector('button') || $content.querySelector('button'); if (f) f.focus(); } }));
  }
  const stepTimer = (e) => timers.find((x) => x.key === stepKey(e.id, e.step));
  function updateBigTimer() {
    const box = document.getElementById('bigtimer');
    if (!box) return;
    const tm = stepTimer(cur());
    if (!tm) return;
    const L = t();
    box.classList.toggle('done', tm.done);
    box.querySelector('.clock').textContent = tm.done ? L.doneShort : fmtClock(tm.remaining);
    box.querySelector('small').textContent = tm.done ? L.timeUp : tm.paused ? L.paused : L.running;
    box.querySelector('.bar i').style.inlineSize = (tm.done ? 100 : 100 - (tm.remaining / tm.total) * 100) + '%';
  }
  setInterval(tick, 250);

  // ---------- Pezzi di interfaccia ----------
  const handlers = {};
  const on = (id, fn) => { handlers[id] = fn; };
  document.addEventListener('click', (ev) => { const b = ev.target.closest && ev.target.closest('button'); if (b && b.id && handlers[b.id]) handlers[b.id](b, ev); });
  const btn = (id, label, sub, cls, ic) => `<button type="button" id="${id}"${cls ? ` class="${cls}"` : ''}>${ic ? icon(ic) : ''}<span class="grow">${label}${sub ? `<span class="sub">${sub}</span>` : ''}</span></button>`;
  const pips = (d) => `<span class="pips" aria-hidden="true">${[1, 2, 3].map((i) => `<i class="${i <= d ? 'on' : ''}"></i>`).join('')}</span>`;
  const stepIcon = (x) => { const c = catOf(x.c); return c ? c.ic : 'wrench'; };
  function guideRow(x, prefix) {
    const L = t();
    const perm = permission(x);
    const risk = x.p || perm === 'pro' ? `<span class="pr">${esc(L.risks[3])}</span>` : x.r >= 2 ? `<span class="rk">${esc(L.risks[2])}</span>` : '';

  // ---------- Schermate ----------
  function renderHome() {
    const L = t();
    if (!coreReady()) return null;
    const emg = D.idx.filter((x) => x.tg.includes('emergency'));
    const resumeId = Object.keys(progress).filter((id) => D.byId.has(id)).sort((a, b) => progress[b].at - progress[a].at)[0];
    const counts = {};
    D.idx.forEach((x) => { counts[x.c] = (counts[x.c] || 0) + 1; });
    const cats = D.tree.cats.filter((c) => counts[c.id]);
    const rx = resumeId && D.byId.get(resumeId);
    $content.innerHTML = `
      <h1 class="hero">${esc(L.home)}</h1>
      ${rx ? btn('resume', `${esc(L.resume)}: ${esc(titleOf(rx))}`, esc(L.resumeSub(progress[resumeId].step + 1, progress[resumeId].n)), 'primary', 'play') : ''}
      ${btn('go-search', esc(L.searchPh), esc(L.searchHint), '', 'search')}
      <h2>${icon('alert')}${esc(L.emergency)}</h2>
      <div class="emg-grid">${emg.map((x) => `<button type="button" id="e-${x.id}" class="emg"><span class="row-ic">${icon('alert')}</span><span class="grow">${esc(titleOf(x))}</span></button>`).join('')}</div>
      <h2>${esc(L.categories)} <span class="n">${D.idx.length}</span></h2>
      <div class="cats">${cats.map((c) => `<button type="button" id="c-${c.id}">${icon(c.ic)}<span class="nm">${esc(catName(c))}</span><span class="ct">${counts[c.id]}</span></button>`).join('')}</div>
      <div style="block-size:0.9rem"></div>
      ${btn('go-tools', esc(L.toolbox), esc(L.toolboxSub), '', 'toolbox')}
      ${btn('go-settings', esc(L.settings), esc(L.settingsSub), '', 'gear')}`;
    $footer.innerHTML = '';

  // Sugli occhiali niente scorrimento durante il lavoro: se il passo non ci sta, si stringe.
  function fitStep() {

  function renderFooter() {
    const e = cur();
    if (e.s !== 'work') return null;
    const g = guide(e.id);
    if (!g || e.step >= g.steps.length) return null;
    const L = t();
    const s = g.steps[e.step];
    const tm = stepTimer(e);
    const focused = activeId();
    const parts = [`<button type="button" id="prev" class="sq" aria-label="${esc(L.prev)}">${icon('back')}</button>`];
    let primary = 'next';
    if (s.timer && !s.check) {
      if (!tm) parts.push(`<button type="button" id="timer-start">${esc(L.startTimer)}</button>`);
      else if (tm.done) parts.push(`<button type="button" id="timer-more">${esc(L.plus5)}</button>`);
      else parts.push(`<button type="button" id="timer-pause">${esc(tm.paused ? L.resumeT : L.pause)}</button>`);
    }
    const last = e.step === g.steps.length - 1;
    if (s.check) {
      if (e.fix) { parts.push(`<button type="button" id="fixed" class="primary">${icon('check')}<span>${esc(L.fixed)}</span></button>`); primary = 'fixed'; }
      else { parts.push(`<button type="button" id="ans-no" class="danger">${esc(L.no)}</button>`, `<button type="button" id="next" class="primary">${icon('check')}<span>${esc(L.yes)}</span></button>`); }
    } else {
      parts.push(`<button type="button" id="next" class="primary${s.warn === 2 ? ' danger' : ''}">${last ? icon('check') : ''}<span>${esc(s.warn === 2 ? L.confirmNext : last ? L.finish : L.next)}</span>${last || s.warn === 2 ? '' : icon('play')}</button>`);
    }
    parts.push(`<button type="button" id="say" class="sq" aria-label="${esc(L.readAloud)}">${icon('speaker')}</button>`);
    $footer.innerHTML = parts.join('');
    on('prev', () => { if (e.step === 0) goBack(); else moveStep(-1); });
    on('next', () => moveStep(1));
    on('ans-no', () => { e.fix = 1; render('fixed'); });
    on('fixed', () => { delete e.fix; render('next'); });
    on('say', () => speak(plainText(s.t) + (s.check ? '. ' + plainText(s.q) : '') + (s.w ? '. ' + plainText(s.w) : ''), true));
    on('timer-start', () => { startTimer(s.timer, s.label, stepKey(g.id, e.step)); render('timer-pause'); });
    on('timer-pause', () => { const x = stepTimer(e); if (x) togglePause(x); renderFooter(); updateBigTimer(); renderTimerbar(); refocus('timer-pause'); });
    on('timer-more', () => { const x = stepTimer(e); if (x) { removeTimer(x); startTimer(300, s.label, stepKey(g.id, e.step)); } render('timer-pause'); });
    if (focused && document.getElementById(focused)) refocus(focused);
    return primary;
  }

  function moveStep(delta) {
    const e = cur();
    const g = guide(e.id);
    if (!g) return;
    const leaving = g.steps[e.step];
    const tm = stepTimer(e);
    if (tm && leaving && (!leaving.bg || tm.done)) removeTimer(tm);
    delete e.fix;
    e.step = Math.min(g.steps.length, Math.max(0, e.step + delta));
    if (e.step >= g.steps.length) { delete progress[g.id]; saveProg(); }
    else enterStep();
    render();
  }

  const CONV_UNITS = {
    mm: ['len', 0.001], cm: ['len', 0.01], m: ['len', 1], in: ['len', 0.0254], ft: ['len', 0.3048],
    m2: ['area', 1], sqft: ['area', 0.092903], l: ['vol', 1], ml: ['vol', 0.001], gal: ['vol', 3.78541], qt: ['vol', 0.946353], floz: ['vol', 0.0295735],
    g: ['mass', 0.001], kg: ['mass', 1], lb: ['mass', 0.453592], oz: ['mass', 0.0283495], bar: ['press', 1], psi: ['press', 0.0689476], c: ['temp'], f: ['temp']
  };
  const U_ALIAS = { '"': 'in', 'inch': 'in', 'inches': 'in', 'pollici': 'in', 'pollice': 'in', 'pouces': 'in', 'pouce': 'in', 'pulgadas': 'in', 'pulgada': 'in', 'zoll': 'in', "'": 'ft', 'feet': 'ft', 'foot': 'ft', 'piedi': 'ft', 'pieds': 'ft', 'pies': 'ft', 'fuß': 'ft', 'fuss': 'ft', 'm²': 'm2', 'mq': 'm2', 'sq ft': 'sqft', 'ft2': 'sqft', 'ft²': 'sqft', 'litri': 'l', 'litro': 'l', 'litres': 'l', 'liters': 'l', 'litre': 'l', 'liter': 'l', 'litros': 'l', 'gallons': 'gal', 'galloni': 'gal', 'galones': 'gal', 'gallonen': 'gal', 'fl oz': 'floz', 'lbs': 'lb', 'pounds': 'lb', 'libbre': 'lb', '°c': 'c', 'celsius': 'c', '°f': 'f', 'fahrenheit': 'f', 'gr': 'g', 'grammi': 'g', 'kilo': 'kg', 'chili': 'kg' };
  function parseMeasure(text) {
    const m = String(text || '').trim().toLowerCase().match(/^(-?\d+(?:[.,]\d+)?)\s*(.*)$/);
    if (!m) return null;
    const v = parseFloat(m[1].replace(',', '.'));
    let u = m[2].trim().replace(/\.$/, '');
    u = U_ALIAS[u] || u;
    if (!CONV_UNITS[u]) return { v, u: null };
    return { v, u };
  }
  const U_SHOW = { m2: 'm²', sqft: 'sq ft', floz: 'fl oz', c: '°C', f: '°F' };
  function conversions(v, u) {
    const [dim, f] = CONV_UNITS[u];
    if (dim === 'temp') return u === 'c' ? [[fmtNum(v * 9 / 5 + 32), '°F']] : [[fmtNum((v - 32) * 5 / 9), '°C']];
    const base = v * f;
    const pick = { len: ['mm', 'cm', 'm', 'in', 'ft'], area: ['m2', 'sqft'], vol: ['ml', 'l', 'floz', 'qt', 'gal'], mass: ['g', 'kg', 'oz', 'lb'], press: ['bar', 'psi'] }[dim];
    return pick.filter((k) => k !== u).map((k) => {
      const x = base / CONV_UNITS[k][1];
      const txt = k === 'in' && x < 12 ? inches(x).replace(/ in$/, '') : fmtNum(x, x < 10 ? 2 : 1);
      return [txt, U_SHOW[k] || k];
    });
  }

      out.innerHTML = `<div class="conv">${conversions(p.v, p.u).map(([a, b]) => `<div><span>${esc(b)}</span><b>${esc(a)}</b></div>`).join('')}</div>`;
    };
    draw();
    const el = document.getElementById('cv');
    el.addEventListener('input', () => { e.v = el.value; draw(); });

  function paintCalc(area, coats) {
    // resa tipica 8–12 m² per litro per mano; in imperiale 350–450 sq ft per gallone
    const need = area * coats;
    const up = (x) => Math.ceil(x * 2) / 2;
    return { lo: up(need / 12), hi: up(need / 8) };
  }
  function renderPaint() {
    const L = t(), e = cur();
    const imp = units === 'imperial';
    const lu = imp ? 'ft' : 'm';
    $content.innerHTML = `<h1>${icon('roller')}${esc(L.paintH)}</h1>
      <div class="pair"><div><label for="pw">${esc(L.widthL)} (${lu})</label><input id="pw" type="text" inputmode="decimal" value="${esc(e.w)}"></div><div><label for="ph">${esc(L.heightL)} (${lu})</label><input id="ph" type="text" inputmode="decimal" value="${esc(e.h)}"></div></div>
      <label>${esc(L.coatsQ)}</label><div class="opts three">${[1, 2, 3].map((n) => `<button type="button" id="pc-${n}" aria-pressed="${e.c === n}">${esc(L.coats(n))}</button>`).join('')}</div>
      <div id="pout"></div>`;
    const draw = () => {
      const w = parseFloat(String(e.w).replace(',', '.')), h = parseFloat(String(e.h).replace(',', '.'));
      const out = document.getElementById('pout');
      if (!(w > 0 && h > 0)) { out.innerHTML = ''; return; }
      const areaM2 = imp ? w * h * 0.092903 : w * h;
      const r = paintCalc(areaM2, e.c);
      const vol = (l) => (imp ? `${fmtNum(Math.max(0.25, Math.ceil((l / 3.78541) * 4) / 4), 2)} gal` : `${fmtNum(l)} l`);
      const areaTxt = imp ? `${fmtNum(Math.round(w * h))} sq ft` : `${fmtNum(areaM2)} m²`;
      out.innerHTML = `<div class="result"><div class="big">${esc(vol(r.lo) === vol(r.hi) ? vol(r.hi) : L.paintRes(vol(r.lo), vol(r.hi)))}</div><p>${esc(L.area)}: ${esc(areaTxt)} · ${esc(L.paintNote(L.coats(e.c)))}</p></div>`;
    };
    draw();
    ['pw', 'ph'].forEach((id) => {
      const el = document.getElementById(id);
      el.addEventListener('input', () => { if (id === 'pw') e.w = el.value; else e.h = el.value; draw(); saveStack(); });
      el.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); refocus(id === 'pw' ? 'ph' : 'pc-' + e.c); } });
    });
    [1, 2, 3].forEach((n) => on('pc-' + n, () => { e.c = n; render('pc-' + n); }));
    footerBack();
    return 'pw';
  }

  function renderQuick() {
    const L = t();
    const opts = [5, 10, 15, 30, 60, 120];
    $content.innerHTML = `<h1>${icon('clock')}${esc(L.quickH)}</h1><p class="meta">${esc(L.quickSub)}</p><div class="opts three">${opts.map((m) => `<button type="button" id="qt-${m}">${esc(fmtMin(m))}</button>`).join('')}</div>`;
    opts.forEach((m) => on('qt-' + m, () => { const tm = startTimer(m * 60, `${L.quickLabel} ${fmtMin(m)}`); toast(L.started(tm.label)); }));
    footerBack();
    return 'qt-10';
  }

  function renderSettings() {
    const L = t();
    $content.innerHTML = `<h1>${icon('gear')}${esc(L.settings)}</h1>
      <h2>${icon('globe')}${esc(L.language)}</h2><div class="langs">${LANGS.map(([k, n]) => `<button type="button" id="lang-${k}" class="${k === lang ? 'on' : ''}" lang="${k}">${n}</button>`).join('')}</div>
      <h2>${icon('flag')}${esc(L.country)}</h2><p class="meta">${esc(L.countrySub)}</p><div class="langs">${COUNTRIES.map((k) => `<button type="button" id="ctry-${k}" class="${k === country ? 'on' : ''}">${esc(L.countries[k])}</button>`).join('')}</div>
      <h2>${icon('ruler')}${esc(L.units)}</h2><div class="opts"><button type="button" id="u-metric" aria-pressed="${units === 'metric'}">${esc(L.metric)}</button><button type="button" id="u-imperial" aria-pressed="${units === 'imperial'}">${esc(L.imperial)}</button></div>
      <h2>${icon('speaker')}</h2>
      ${btn('voice', esc(voiceOn ? L.voiceOn : L.voiceOff), esc(L.voiceSub), '', 'clock')}
      ${btn('read', esc(readOn ? L.readOn : L.readOff), esc(L.readSub), '', 'speaker')}`;
    LANGS.forEach(([k]) => on('lang-' + k, () => { lang = k; store.set('fv_lang', k); document.documentElement.lang = k; render('lang-' + k); }));
    COUNTRIES.forEach((k) => on('ctry-' + k, () => { country = k; store.set('fv_country', k); render('ctry-' + k); }));
    ['metric', 'imperial'].forEach((k) => on('u-' + k, () => { units = k; store.set('fv_units', k); render('u-' + k); }));
    on('voice', () => { voiceOn = !voiceOn; store.set('fv_voice', voiceOn); render('voice'); });
    on('read', () => { readOn = !readOn; store.set('fv_read', readOn); render('read'); });
    footerBack();
    return 'lang-' + lang;
  }

  function refocus(id) { const el = document.getElementById(id); if (el) el.focus({ preventScroll: false }); }
  // Indietro sempre a portata, in alto a sinistra, su ogni schermata tranne la home.
  const $back = document.getElementById('hb-back');
  function drawBack() {
    $back.hidden = stack.length < 2;
    $back.setAttribute('aria-label', t().back);
    $back.innerHTML = '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M20 6L10 16l10 10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>' + `<span>${esc(t().back)}</span>`;
  }
  $back.addEventListener('click', () => { if (stack.length < 2) return; if (pushed) history.back(); else { stack.pop(); render(cur().f); } });
  function render(focusId) {
    drawBack();
    for (const k in handlers) delete handlers[k];
    ringSig = null;
    $content.classList.remove('tight', 'tighter');
    const e = cur();
    let primary;
    switch (e.s) {
      case 'cat': primary = renderCat(); break;
      case 'search': primary = renderSearch(); break;
      case 'guide': primary = renderGuide(); break;
      case 'gate': primary = renderGate(); break;
      case 'work': primary = renderWork(); break;
      case 'pro': primary = renderPro(); break;
      case 'tools': primary = renderTools(); break;
      case 'conv': primary = renderConv(); break;
      case 'plugs': primary = renderPlugs(); break;
      case 'paint': primary = renderPaint(); break;
      case 'quick': primary = renderQuick(); break;
      case 'settings': primary = renderSettings(); break;
      default: e.s = 'home'; primary = renderHome();
    }
    if (cur() !== e) return; // la schermata ne ha aperta un'altra
    if (e !== lastEntry) { $content.scrollTop = 0; lastEntry = e; }
    renderTimerbar();
    registerTools();
    saveStack();
    lastPrimary = primary;
    const want = focusId && document.getElementById(focusId) ? focusId : primary;
    requestAnimationFrame(() => { if (want) refocus(want); });
  }

  // ---------- Strumenti per Meta AI (WebMCP) ----------
  let toolsController = null, toolsKey = '';
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
  function findGuide(q) {
    const s = String(q || '').trim();
    if (!s) return null;
    if (D.byId.has(s)) return s;
    const hit = search(s)[0];
    return hit ? hit.id : null;
  }
  function guideSummary(g) {
    const x = D.byId.get(g.id);
    return {
      id: g.id, title: g.title, difficulty: ['easy', 'medium', 'demanding'][g.diff - 1], hands_on_minutes: g.active, total_minutes: g.total,
      risk: ['safe', 'caution', 'serious', 'professional only'][g.risk], allowed_in_user_country: permission(x) !== 'pro', country: country,
      protective_gear: g.ppe, tools: g.tools.map((i) => i.n), materials: g.mats.map((i) => (fmtQty(i.q, i.u) + ' ' + i.n).trim()),
      steps: g.steps.map((s, i) => `${i + 1}. ${plainText(s.t)}${s.timer ? ` (timer ${Math.round(s.timer / 60)} min)` : ''}${s.check ? ` [check: ${plainText(s.q)}]` : ''}`),
      tips: g.tips.map(plainText)
    };
  }
  function registerTools() {
    if (!document.modelContext || typeof document.modelContext.registerTool !== 'function') return;
    const e = cur();
    const key = [e.s, e.id || '', lang, D.st, country, units].join('|');
    if (key === toolsKey) return;
    toolsKey = key;
    if (toolsController) toolsController.abort();
    toolsController = new AbortController();
    const signal = toolsController.signal;
    const reg = (def) => { try { const p = document.modelContext.registerTool(def, { signal }); if (p && p.catch) p.catch(() => {}); } catch (er) { /* non deve bloccare l'app */ } };
    const core = () => withTimeout(loadCore(), 8000);

    reg({
      name: 'repairs_search',
      description: 'Searches FixView, a library of about 50 hands-free DIY and repair guides (plumbing, furniture, walls, doors, electrics, bathroom, floors, appliances, bike and car, garden, sewing, seasonal). Returns ids and titles in the app language.',
      annotations: { readOnlyHint: true },
      inputSchema: { type: 'object', properties: { query: { type: 'string', description: 'What needs fixing, in any of the 5 languages (e.g. "dripping tap", "silicone shower").' }, emergency_only: { type: 'boolean', description: 'Only urgent home problems.' } } },
      async execute(input) {
        try { await core(); } catch (er) { return { error: 'offline', next_action: 'Say the guides could not be loaded. Stop.' }; }
        const q = String((input && input.query) || '').trim();
        let list = q ? search(q) : D.idx.slice();
        if (input && input.emergency_only) list = list.filter((x) => x.tg.includes('emergency'));
        return { language: NAME_EN[lang], total: list.length, results: list.slice(0, 10).map((x) => ({ id: x.id, title: titleOf(x), category: catName(catOf(x.c)), hands_on_minutes: x.a, risk: ['safe', 'caution', 'serious', 'professional only'][x.r], needs_professional_in_user_country: !!x.p || permission(x) === 'pro' })), next_action: list.length ? 'Offer one or two in a short sentence, or call guide_open.' : 'Say nothing matched. Stop.' };
      }
    });
    reg({
      name: 'guide_open',
      description: 'Shows a repair guide on the glasses display, with its tools, materials and safety level. Returns the full guide so you can answer questions about it.',
      inputSchema: { type: 'object', properties: { guide: { type: 'string', description: 'Guide id from repairs_search, or the job in words.' } }, required: ['guide'] },
      async execute(input) {
        try { await core(); } catch (er) { return { error: 'offline' }; }
        const id = findGuide(input && input.guide);
        if (!id) return { error: 'not_found', next_action: 'Say no guide matched. Stop.' };
        let g;
        try { g = await withTimeout(ensure(id), 8000); } catch (er) { return { error: 'offline' }; }
        go({ s: 'guide', id });
        return { ...guideSummary(g), next_action: 'The guide is on screen. Say its title and hands-on time in one sentence. Do not read the steps aloud.' };
      }
    });
    reg({
      name: 'settings_set',
      description: 'Changes FixView settings: language, measurement units or the country used for safety rules.',
      inputSchema: { type: 'object', properties: { language: { type: 'string', enum: LANGS.map((l) => l[0]) }, units: { type: 'string', enum: ['metric', 'imperial'] }, country: { type: 'string', enum: COUNTRIES } } },
      async execute(input) {
        if (input && T[input.language]) { lang = input.language; store.set('fv_lang', lang); document.documentElement.lang = lang; }
        if (input && (input.units === 'metric' || input.units === 'imperial')) { units = input.units; store.set('fv_units', units); }
        if (input && COUNTRIES.includes(input.country)) { country = input.country; store.set('fv_country', country); }
        render(activeId());
        return { language: NAME_EN[lang], units, country, next_action: 'Confirm in one short sentence. Stop.' };
      }
    });
    reg({
      name: 'convert_measure',
      description: 'Converts a measurement between metric and imperial (mm, cm, m, in, ft, m2, sq ft, l, gal, kg, lb, bar, psi, °C, °F).',
      annotations: { readOnlyHint: true },
      inputSchema: { type: 'object', properties: { value: { type: 'number' }, unit: { type: 'string' } }, required: ['value', 'unit'] },
      async execute(input) {
        const p = parseMeasure(`${input && input.value} ${input && input.unit}`);
        if (!p || !p.u) return { error: 'unknown_unit' };
        return { conversions: conversions(p.v, p.u).map(([a, b]) => `${a} ${b}`), next_action: 'Say the most useful one. Stop.' };
      }
    });
    reg({
      name: 'wall_plug_advice',
      description: 'Suggests the wall plug (anchor) and drill bit for a wall type and weight, and opens it on screen.',
      inputSchema: { type: 'object', properties: { wall: { type: 'string', enum: ['solid', 'hollow', 'board', 'wood'], description: 'solid brick/concrete, hollow brick, plasterboard, wood' }, weight_kg: { type: 'number' } }, required: ['wall', 'weight_kg'] },
      async execute(input) {
        const w = PLUG_MAP[input && input.wall] ? input.wall : 'solid';
        const kg = Number(input && input.weight_kg) || 1;
        const l = kg <= 5 ? 'light' : kg <= 20 ? 'medium' : 'heavy';
        go({ s: 'plugs', w, l });
        return { ...plugAdvice(w, l), next_action: 'Say the plug in one sentence; it is on screen. Stop.' };
      }
    });
    reg({
      name: 'timer_start',
      description: 'Starts a timer shown at the top of the display (glue, filler, paint drying, soaking).',
      inputSchema: { type: 'object', properties: { minutes: { type: 'number', description: '1 to 1440' }, label: { type: 'string' } }, required: ['minutes'] },
      async execute(input) {
        const m = Number(input && input.minutes);
        if (!isFinite(m) || m < 0.25 || m > 1440) return { error: 'out_of_range' };
        const tm = startTimer(Math.round(m * 60), String((input && input.label) || '').trim().slice(0, 20) || t().timer);
        return { started: tm.label, minutes: m, next_action: 'Confirm in one short sentence. Stop.' };
      }
    });
    reg({
      name: 'timer_status',
      description: 'Tells how much time is left on each running timer.',
      annotations: { readOnlyHint: true },
      async execute() { return { timers: timers.map((x) => ({ label: x.label, left: x.done ? 'done' : fmtClock(x.remaining), paused: x.paused })), next_action: 'Answer in one short sentence. Stop.' }; }
    });

    if (e.s === 'guide') {
      reg({
        name: 'guide_start',
        description: 'Starts the guide on screen, one step per screen. For serious-risk jobs the user must first tick the safety checklist on the display themselves.',
        async execute() {
          const g = guide(e.id);
          if (!g) return { error: 'not_ready' };
          beginWork(g);
          return cur().s === 'gate' ? { safety_checklist: gateItems(g).map(plainText), next_action: 'Tell the user to confirm each safety point on the display with their own hands. You cannot confirm it for them. Stop.' } : { step: cur().step + 1, of: g.steps.length, next_action: 'Do not read the step aloud; it is on screen. Stop.' };
        }
      });
    }
    if (e.s === 'work') {
      const g = guide(e.id);
      reg({
        name: 'step_next',
        description: 'Moves to the next step of the repair. Do not use it on a checkpoint step if the user answered no: use checkpoint_answer.',
        async execute() {
          const c = cur(), gg = guide(c.id);
          if (!gg || c.s !== 'work') return { error: 'not_working' };
          const s = gg.steps[c.step];
          if (s && s.warn === 2) return { blocked: true, warning: plainText(s.w), next_action: 'This step needs the user to confirm on the display with the Done button. Say the warning briefly. Stop.' };
          moveStep(1);
          if (cur().step >= gg.steps.length) return { finished: true, next_action: 'Say the job is done. Stop.' };
          return { step: cur().step + 1, of: gg.steps.length, next_action: 'Do not read the step aloud; the user sees it. Stop.' };
        }
      });
      reg({
        name: 'step_previous',
        description: 'Goes back one step.',
        async execute() { if (cur().step === 0) return { error: 'first_step' }; moveStep(-1); return { step: cur().step + 1, next_action: 'Stop.' }; }
      });
      reg({
        name: 'step_current',
        description: 'Returns the current step text, its safety warning and checkpoint question, to answer the user\'s questions about it.',
        annotations: { readOnlyHint: true },
        async execute() {
          const c = cur(), gg = guide(c.id), s = gg && gg.steps[c.step];
          if (!s) return { error: 'not_working' };
          return { guide: gg.title, step: c.step + 1, of: gg.steps.length, text: plainText(s.t), warning: s.w ? plainText(s.w) : null, checkpoint: s.check ? plainText(s.q) : null, if_no: s.check ? plainText(s.fix) : null, tools: gg.tools.map((i) => i.n), next_action: 'Answer the user\'s question briefly, in ' + NAME_EN[lang] + '.' };
        }
      });
      if (g && g.steps[e.step] && g.steps[e.step].check) {
        reg({
          name: 'checkpoint_answer',
          description: 'Records the user\'s yes/no answer to the checkpoint question on screen. Yes moves on; no shows how to fix it.',
          inputSchema: { type: 'object', properties: { ok: { type: 'boolean' } }, required: ['ok'] },
          async execute(input) {
            const c = cur(), gg = guide(c.id), s = gg && gg.steps[c.step];
            if (!s || !s.check) return { error: 'no_checkpoint' };
            if (input && input.ok) { moveStep(1); return { moved_on: true, next_action: 'Stop.' }; }
            c.fix = 1; render('fixed');
            return { fix: plainText(s.fix), next_action: 'The fix is on screen. Say it in one short sentence. Stop.' };
          }
        });
      }
    }
  }

  // ---------- Avvio ----------
  document.documentElement.lang = lang;
  loadCore().catch(() => {});
  render();
  if (navigator.wakeLock && navigator.wakeLock.request) navigator.wakeLock.request('screen').catch(() => {});
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
