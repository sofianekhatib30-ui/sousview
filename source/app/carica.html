<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #07090B; --card: #11151A; --line: #262D35; --ink: #F4F6F8; --quiet: #9AA3AD;
    --blue: #4DA3FF; --red: #FF4D5A; --gold: #FFC93C; --green: #4FD18B;
    --wide: 'Archivo', 'Arial Black', system-ui, sans-serif;
    --sans: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color-scheme: dark;
  }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.45; }
  main { max-inline-size: 760px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-block-end: 18px; }
  .brand { display: flex; align-items: center; gap: 8px; font-family: var(--wide); font-variation-settings: 'wdth' 118; font-weight: 900; color: var(--blue); }
  .brand svg { inline-size: 40px; block-size: 20px; }
  select, input, textarea, button { font: inherit; color: inherit; }
  select, input, textarea { background: #0B0E12; border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 11px; inline-size: 100%; min-inline-size: 0; }
  select:focus, input:focus, textarea:focus { outline: 2px solid var(--blue); outline-offset: 1px; border-color: var(--blue); }
  h1 { font-family: var(--wide); font-variation-settings: 'wdth' 112; font-weight: 850; font-size: clamp(28px, 7vw, 40px); line-height: 1.02; margin: 0 0 10px; }
  h2 { font-family: var(--wide); font-variation-settings: 'wdth' 110; font-weight: 800; font-size: 20px; margin: 0 0 10px; }
  p { margin: 0 0 12px; }
  .lead { color: var(--quiet); max-inline-size: 60ch; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-block-end: 16px; }
  .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 18px 0; }
  .steps div { border-block-start: 3px solid var(--line); padding-block-start: 8px; font-size: 13px; color: var(--quiet); }
  .steps div.on { border-color: var(--blue); color: var(--ink); }
  .steps b { display: block; font-family: var(--wide); font-size: 15px; }
  .drop { display: grid; place-items: center; text-align: center; gap: 6px; border: 2px dashed var(--line); border-radius: 14px; padding: 26px 14px; cursor: pointer; }
  .drop:hover, .drop.over { border-color: var(--blue); }
  .drop b { font-size: 17px; }
  .drop span { color: var(--quiet); font-size: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px solid var(--line); background: #161B21; border-radius: 10px; padding: 10px 16px; font-weight: 700; cursor: pointer; }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #000; }
  .btn.ghost { background: transparent; }
  .btn.danger { color: var(--red); border-color: transparent; background: transparent; padding-inline: 8px; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  textarea { min-block-size: 130px; resize: vertical; }
  .msg { border-inline-start: 3px solid var(--blue); padding: 6px 0 6px 12px; margin: 12px 0; }
  .msg.err { border-color: var(--red); }
  .msg.warn { border-color: var(--gold); }
  .day { border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-block-end: 14px; }
  .day-h { display: flex; gap: 8px; align-items: center; margin-block-end: 10px; }
  .day-h input { font-weight: 800; }
  .ex { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 0; border-block-start: 1px solid var(--line); }
  .ex:first-of-type { border-block-start: 0; }
  .fig { inline-size: 44px; block-size: 44px; stroke: var(--ink); fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; background: #0B0E12; border-radius: 8px; }
  .fig .eq { stroke: var(--blue); } .fig .gr { stroke: #3a434d; } .fig .hd { fill: var(--ink); stroke: none; }
  .fields { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-block-start: 8px; }
  .fields label { font-size: 12px; color: var(--quiet); display: grid; gap: 3px; }
  .fields input, .fields select { padding: 7px 8px; }
  .match { font-size: 12px; margin-block-start: 4px; }
  .match.ok { color: var(--green); }
  .match.no { color: var(--gold); }
  .wide2 { grid-column: span 2; }
  .wide3 { grid-column: span 3; }
  .wide6 { grid-column: 1 / -1; }
  .code { font-family: var(--wide); font-variation-settings: 'wdth' 125; font-weight: 900; font-size: clamp(48px, 16vw, 80px); letter-spacing: 0.08em; color: var(--blue); font-variant-numeric: tabular-nums; margin: 6px 0 10px; }
  ol.how { padding-inline-start: 20px; margin: 0 0 12px; }
  ol.how li { margin-block-end: 6px; }
  .say { font-weight: 800; color: var(--gold); }
  .small { font-size: 13px; color: var(--quiet); }
  .hidden { display: none !important; }
  @media (max-width: 560px) {
    .fields { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .wide3 { grid-column: span 4; }
  }
</style>

    <div class="row"><button class="btn ghost" id="addday" type="button"></button></div>
    <div id="msg2"></div>
    <div class="row" style="margin-block-start:16px"><button class="btn primary" id="send" type="button"></button><button class="btn ghost" id="restart" type="button"></button></div>
  </section>

  <section id="step3" class="card hidden">
    <h2 id="t-done"></h2>
    <div class="code" id="code"></div>
    <ol class="how" id="how"></ol>
    <p id="t-say"></p>
    <div class="row"><button class="btn ghost" id="again" type="button"></button></div>
  </section>

  <p class="small" id="t-privacy"></p>
  <datalist id="exlist"></datalist>
</main>

  const fig = (pat) => { const f = FIGS[pat] || FIGS.machine; return `<svg class="fig" viewBox="0 0 48 48" aria-hidden="true">${f[THUMB0.has(pat) ? 0 : 1]}</svg>`; };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ß/g, 'ss').replace(/[^a-z0-9]+/g, ' ').trim();
  let lang = (() => { try { const s = JSON.parse(localStorage.getItem('lv_lang')); if (T[s]) return s; } catch (e) { /* niente */ } const k = (navigator.language || 'en').slice(0, 2); return T[k] ? k : 'en'; })();
  const t = () => T[lang];
  let LIB = [], NAMES = {}, NAME_INDEX = new Map(), prog = null;

  async function loadLib() {
    const base = await (await fetch('data/exercises.json')).json();
    LIB = base;
    const langs = await Promise.all(LANGS.map(([k]) => fetch(`data/${k}.json`).then((r) => r.json())));
    LANGS.forEach(([k], i) => { NAMES[k] = langs[i]; });
    NAME_INDEX = new Map();
    for (const x of base) for (const [k] of LANGS) { const y = NAMES[k][x.id]; if (!y) continue; [y.n].concat(y.al || []).forEach((n) => { const key = norm(n); if (key && !NAME_INDEX.has(key)) NAME_INDEX.set(key, x.id); }); }
    fillDatalist();
  }
  const libById = (id) => LIB.find((x) => x.id === id);
  const nameIn = (id) => (NAMES[lang] && NAMES[lang][id] ? NAMES[lang][id].n : id);
  function fillDatalist() { $('exlist').innerHTML = LIB.map((x) => `<option value="${esc(nameIn(x.id))}"></option>`).join(''); }
  function matchName(name) { return NAME_INDEX.get(norm(name)) || null; }

  function setTexts() {
    const L = t();
    document.documentElement.lang = lang;
    ['title', 'lead', 's1', 's2', 's3', 'up', 'drop', 'dropsub', 'or', 'check', 'checksub', 'pname', 'pnotes', 'done', 'privacy'].forEach((k) => { const el = $('t-' + k); if (el) el.textContent = L[k]; });
    $('paste').placeholder = L.paste; $('read').textContent = L.read; $('manual').textContent = L.manual; $('addday').textContent = L.addday; $('send').textContent = L.send; $('restart').textContent = L.restart; $('again').textContent = L.again;
    $('lang').innerHTML = LANGS.map(([k, n]) => `<option value="${k}"${k === lang ? ' selected' : ''}>${n}</option>`).join('');
    if (prog) renderEditor();
    if (LIB.length) fillDatalist();
  }
  const msg = (box, text, cls) => { $(box).innerHTML = text ? `<div class="msg ${cls || ''}" role="status">${esc(text)}</div>` : ''; };
  function step(n) { [1, 2, 3].forEach((i) => { $('step' + i).classList.toggle('hidden', i !== n); $('st' + i).classList.toggle('on', i <= n); }); window.scrollTo({ top: 0, behavior: 'smooth' }); }

  // ---------- Lettura ----------
  let picked = null;
  $('file').addEventListener('change', () => { picked = $('file').files[0] || null; if (picked) { $('t-drop').textContent = picked.name; } });
  const drop = $('drop');
  drop.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } });
  ['dragover', 'dragenter'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', (e) => { const f = e.dataTransfer.files[0]; if (f) { picked = f; $('t-drop').textContent = f.name; } });
  const toB64 = (buf) => { let s = ''; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
  function imageToJpeg(file) {
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => {
        const max = 2000, k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
        URL.revokeObjectURL(img.src);
      };
      img.onerror = rej;
      img.src = URL.createObjectURL(file);
    });
  }
  $('read').addEventListener('click', async () => {
    const L = t();
    const text = $('paste').value.trim();
    let body;
    try {
      if (picked && picked.type === 'application/pdf') {
        if (picked.size > 3200000) return msg('msg1', L.tooBig, 'err');
        body = { kind: 'pdf', data: toB64(await picked.arrayBuffer()) };
      } else if (picked && /^image\//.test(picked.type)) {
        body = { kind: 'image', media: 'image/jpeg', data: await imageToJpeg(picked) };
      } else if (text) body = { kind: 'text', data: text };
      else return msg('msg1', L.needInput, 'err');
    } catch (e) { return msg('msg1', L.failed, 'err'); }
    $('read').disabled = true; msg('msg1', L.reading);
    try {
      const r = await fetch('api/leggi', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
      const out = await r.json().catch(() => ({}));
      if (r.status === 503 && out.error === 'no_key') { msg('msg1', ''); startManual(L.noKey); return; }
      if (r.status === 413) return msg('msg1', L.tooBig, 'err');
      if (r.status === 422) return msg('msg1', L.notProg, 'err');
      if (!r.ok || !out.program) return msg('msg1', L.failed, 'err');
      msg('msg1', '');
      prog = out.program;
      prog.days.forEach((d) => d.items.forEach((it) => { if (!it.ex && it.name) it.ex = matchName(it.name); }));
      renderEditor(); step(2);
    } catch (e) { msg('msg1', L.failed, 'err'); }
    finally { $('read').disabled = false; }
  });
  const blankItem = () => ({ ex: null, name: '', pattern: 'machine', equipment: 'dumbbell', kind: 'load', sets: 3, reps_min: 10, reps_max: 10, seconds: null, rest_seconds: 90, weight_kg: null, note: null, superset: null });
  function startManual(note) {
    prog = { name: '', notes: null, per_week: 3, days: [{ name: t().dayName('A'), items: [blankItem()] }] };
    renderEditor(); step(2);
    if (note) msg('msg2', note, 'warn');
  }
  $('manual').addEventListener('click', () => startManual());

  // ---------- Controllo e modifica ----------
  function renderEditor() {
    const L = t();
    $('pname').value = prog.name || ''; $('pnotes').value = prog.notes || '';
    const pats = Object.keys(L.pats);
    $('days').innerHTML = prog.days.map((d, di) => `
      <div class="day">
        <div class="day-h"><input data-d="${di}" data-f="dname" value="${esc(d.name)}" aria-label="${esc(L.day)}" maxlength="30"><button class="btn danger" type="button" data-del-day="${di}">${esc(L.delday)}</button></div>
        ${d.items.map((it, ii) => {
          const lib = it.ex && libById(it.ex);
          const pat = lib ? lib.pat : it.pattern;
          const timed = it.kind === 'time';
          return `<div class="ex">
            ${fig(pat)}
            <div>
              <input list="exlist" data-d="${di}" data-i="${ii}" data-f="name" value="${esc(it.name || (lib ? nameIn(lib.id) : ''))}" placeholder="${esc(L.exname)}" aria-label="${esc(L.exname)}" maxlength="40">
              <div class="match ${lib ? 'ok' : 'no'}">${lib ? esc(L.matched(nameIn(lib.id))) : esc(L.unmatched)}</div>
              <div class="fields">
                <label>${esc(L.sets)}<input type="number" inputmode="numeric" min="1" max="12" data-d="${di}" data-i="${ii}" data-f="sets" value="${it.sets ?? ''}"></label>
                ${timed ? `<label class="wide2">${esc(L.secs)}<input type="number" inputmode="numeric" min="5" max="600" data-d="${di}" data-i="${ii}" data-f="seconds" value="${it.seconds ?? ''}"></label>` : `<label>${esc(L.repsMin)}<input type="number" inputmode="numeric" min="1" max="100" data-d="${di}" data-i="${ii}" data-f="reps_min" value="${it.reps_min ?? ''}"></label><label>${esc(L.repsMax)}<input type="number" inputmode="numeric" min="1" max="100" data-d="${di}" data-i="${ii}" data-f="reps_max" value="${it.reps_max ?? ''}"></label>`}
                <label>${esc(L.rest)}<input type="number" inputmode="numeric" min="0" max="600" data-d="${di}" data-i="${ii}" data-f="rest_seconds" value="${it.rest_seconds ?? ''}"></label>
                <label>${esc(L.weight)}<input type="number" inputmode="decimal" min="0" max="500" step="0.5" data-d="${di}" data-i="${ii}" data-f="weight_kg" value="${it.weight_kg ?? ''}"${it.kind !== 'load' ? ' disabled' : ''}></label>
                <label>${esc(L.ss)}<input maxlength="2" data-d="${di}" data-i="${ii}" data-f="superset" value="${esc(it.superset || '')}" placeholder="A"></label>
                <label class="wide3">${esc(L.kind)}<select data-d="${di}" data-i="${ii}" data-f="kind">${Object.entries(L.kinds).map(([k, v]) => `<option value="${k}"${it.kind === k ? ' selected' : ''}>${esc(v)}</option>`).join('')}</select></label>
                ${lib ? '' : `<label class="wide3">${esc(L.pattern)}<select data-d="${di}" data-i="${ii}" data-f="pattern">${pats.map((k) => `<option value="${k}"${pat === k ? ' selected' : ''}>${esc(L.pats[k])}</option>`).join('')}</select></label>`}
                <label class="wide6">${esc(L.note)}<input maxlength="90" data-d="${di}" data-i="${ii}" data-f="note" value="${esc(it.note || '')}"></label>
              </div>
            </div>
            <button class="btn danger" type="button" data-del-ex="${di}:${ii}" aria-label="${esc(L.delex)}">✕</button>
          </div>`;
        }).join('')}
        <button class="btn ghost" type="button" data-add-ex="${di}">${esc(L.addex)}</button>
      </div>`).join('');
  }
  $('days').addEventListener('change', (e) => {
    const el = e.target, f = el.dataset.f;
    if (!f) return;
    const d = prog.days[+el.dataset.d];
    if (f === 'dname') { d.name = el.value.trim(); return; }
    const it = d.items[+el.dataset.i];
    const v = el.value.trim();
    if (f === 'name') {
      it.name = v; it.ex = matchName(v);
      if (it.ex) { const lib = libById(it.ex); it.pattern = lib.pat; it.equipment = lib.eq; it.kind = lib.kind; if (lib.kind === 'time' && !it.seconds) it.seconds = 30; }
      renderEditor(); return;
    }
    if (['sets', 'reps_min', 'reps_max', 'seconds', 'rest_seconds'].includes(f)) it[f] = v === '' ? null : Math.round(Number(v));
    else if (f === 'weight_kg') it[f] = v === '' ? null : Number(v.replace(',', '.'));
    else if (f === 'superset') it[f] = v ? v.toUpperCase() : null;
    else if (f === 'kind') { it.kind = v; if (v === 'time' && !it.seconds) it.seconds = 30; if (v !== 'time' && !it.reps_min) { it.reps_min = 10; it.reps_max = 10; } renderEditor(); }
    else it[f] = v || null;
  });
  $('days').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.addEx != null) { prog.days[+b.dataset.addEx].items.push(blankItem()); renderEditor(); }
    if (b.dataset.delEx) { const [d, i] = b.dataset.delEx.split(':').map(Number); prog.days[d].items.splice(i, 1); renderEditor(); }
    if (b.dataset.delDay != null) { prog.days.splice(+b.dataset.delDay, 1); if (!prog.days.length) prog.days.push({ name: t().dayName('A'), items: [blankItem()] }); renderEditor(); }
  });
  $('addday').addEventListener('click', () => { prog.days.push({ name: t().dayName(String.fromCharCode(65 + prog.days.length)), items: [blankItem()] }); renderEditor(); });
  $('pname').addEventListener('change', () => { prog.name = $('pname').value.trim(); });
  $('pnotes').addEventListener('change', () => { prog.notes = $('pnotes').value.trim() || null; });
  $('restart').addEventListener('click', () => { prog = null; picked = null; $('file').value = ''; $('paste').value = ''; setTexts(); step(1); });
  $('again').addEventListener('click', () => $('restart').click());
  $('send').addEventListener('click', async () => {
    const L = t();
    prog.name = $('pname').value.trim() || prog.name; prog.notes = $('pnotes').value.trim() || null;
    const items = prog.days.flatMap((d) => d.items).filter((it) => it.ex || (it.name && it.name.trim()));
    if (!items.length) return msg('msg2', L.empty, 'err');
    prog.days.forEach((d) => { d.items = d.items.filter((it) => it.ex || (it.name && it.name.trim())); d.items.forEach((it) => { if (!it.name && it.ex) it.name = nameIn(it.ex); }); });
    prog.days = prog.days.filter((d) => d.items.length);
    $('send').disabled = true; msg('msg2', L.sending);
    try {
      const r = await fetch('api/scheda', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ program: prog }) });
      const out = await r.json().catch(() => ({}));
      if (!r.ok || !out.code) throw new Error('fail');
      msg('msg2', '');
      $('code').textContent = out.code;
      $('how').innerHTML = L.how.map((x) => `<li>${esc(x)}</li>`).join('');
      $('t-say').innerHTML = `<span class="say">${esc(L.say(out.code))}</span>`;
      step(3);
    } catch (e) { msg('msg2', L.sendFail, 'err'); }
    finally { $('send').disabled = false; }
  });
  $('lang').addEventListener('change', () => { lang = $('lang').value; try { localStorage.setItem('lv_lang', JSON.stringify(lang)); } catch (e) { /* niente */ } setTexts(); });

  setTexts();
  loadLib().catch(() => {});
})();
</script>
</body>
</html>
